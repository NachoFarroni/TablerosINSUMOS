const REP_TOPE_TABLA=15;
// Tope de la columna Situación del mail. Medido sobre datos reales: el módulo de la skill
// usa word-break en las celdas (que en Chrome se comporta como overflow-wrap:anywhere), así
// que si esta columna se queda con el ancho, la de importes parte los números a la mitad
// ("1.043.56 / 7"). Con 40 deja de pasar; 38 deja margen para importes de 8 dígitos.
const REP_TOPE_SIT=38;   // filas en el mail; el detalle completo va en el Excel
// Los importes van SIEMPRE exactos, sin abreviar: ni "1.043,6" ni "USD 1,04 M".
const repUSD=v=>Math.round(v||0).toLocaleString('es-AR');

function repGraficos(R){
  const g1=svgBarras({categorias:['0-30 días','31-60 días','61-90 días','+90 días'],
    series:[{nombre:'Vencido',valores:R.buckets.map(v=>Math.round(v))}],ancho:6.6,alto:2.9});
  const top8=R.aSeguir.slice(0,8);
  const g2=svgBarras({categorias:top8.map(c=>nombreCorto(c.cliente,14)),
    series:[{nombre:'Vencido',valores:top8.map(c=>Math.round(c.vencido))},
            {nombre:'Descubierto',valores:top8.map(c=>Math.round(c.descubierto))}],
    horizontal:true,ancho:6.6,alto:4.0});
  return{g1,g2};
}

async function generarMailReporte(R,destinos){
  const{g1,g2}=repGraficos(R);
  const p1=await svgAPng(g1),p2=await svgAPng(g2);
  // Los gráficos viajan como adjuntos EN LÍNEA (cid:), igual que el logo y el encabezado.
  // Incrustarlos como data: haría que Gmail corte el mail (límite ~100 KB) y además
  // Gmail y Outlook bloquean las imágenes data:.
  const img=(cid,alt,w)=>'<img src="cid:'+cid+'" alt="'+alt+'" width="'+w+
    '" style="display:block;width:100%;max-width:'+w+'px;height:auto;border:0;border-radius:14px;margin:0 0 20px 0;">';

  const cuerpo=(m)=>
    MailFyo.saludo('¡Hola!','Va el reporte semanal de deuda vencida de clientes de insumos. Se muestran solo los clientes con saldo descubierto o con incumplimientos de entrega; el detalle completo de la cartera está en el Excel adjunto.')
    +MailFyo.indicadores([
      {valor:'USD '+repUSD(R.totalVencido),etiqueta:'Deuda vencida total'},
      {valor:'USD '+repUSD(R.totalDescubierto),etiqueta:'Descubierto'},
      {valor:(R.pctMas30*100).toFixed(1).replace('.',',')+'%',
       etiqueta:'Vencido +30d · '+(R.dentroDelLimite?'dentro del 20%':'supera el 20%')},
    ],m)
    +MailFyo.etiqueta('Vencido por antigüedad')
    +img('fyo-reporte-g1','Vencido por antigüedad, en USD',605)
    +MailFyo.etiqueta('Vencido vs. descubierto · 8 clientes con más descubierto')
    +img('fyo-reporte-g2','Vencido y descubierto por cliente, en USD',605)
    +MailFyo.etiqueta('Clientes a seguir')
    +MailFyo.tabla({
      // Importes exactos: se saca "+30 días" para que las columnas entren en los 680 px
      // del mail. El desglose por tramo completo va en el Excel adjunto.
      columnas:['Cliente',{texto:'Vencido',alinear:'right'},{texto:'Cubierto',alinear:'right'},
                {texto:'Descubierto',alinear:'right'},'Situación'],
      // Cuatro columnas a propósito: el módulo de la skill pone word-break en las celdas,
      // y con cinco columnas de importes exactos la tabla parte los números a la mitad
      // ("1.043.56 / 7"). Acá van los dos números accionables — cuánto debe y cuánto de eso
      // está sin respaldo — y el desglose completo (tramos y cubierto) va en el Excel.
      columnas:['Cliente',{texto:'Vencido',alinear:'right'},
                {texto:'Descubierto',alinear:'right'},'Situación'],
      filas:R.aSeguir.slice(0,REP_TOPE_TABLA).map(c=>{
        const sit=(c.incumplimiento?'Entrega vencida · ':'')+c.comentario;
        return[nombreCorto(c.cliente,16),repUSD(c.vencido),repUSD(c.descubierto),
          sit.length>REP_TOPE_SIT?sit.slice(0,REP_TOPE_SIT-1).trimEnd()+'…':sit];}),
      nota:'Importes en USD. El desglose por tramo de antigüedad y lo cubierto por cliente están en el Excel adjunto. '
        +(R.aSeguir.length>REP_TOPE_TABLA?'Se muestran '+REP_TOPE_TABLA+' de '+R.aSeguir.length+' clientes a seguir; el resto está en el Excel adjunto. ':'')
        +'Otros '+R.otros.n+' clientes tienen el vencido cubierto por USD '+repUSD(R.otros.usd)+' y no se listan.',
    },m)
    +(R.logistica.length?MailFyo.etiqueta('Pedido a Logística')+MailFyo.tarjeta({
      titulo:'Contratos a entregar que cubren deuda vencida',
      texto:'Pedimos asignar los cupos de estos contratos: su entrega cancela deuda ya vencida.',
      filas:R.logistica.map(l=>['Ctto '+l.contrato,
        nombreCorto(l.cliente,18)+' · USD '+Math.round(l.usd).toLocaleString('es-AR')+(l.entregaVencida?' · entrega vencida':'')]),
    },m):'')
    +MailFyo.cierre({texto:'Cualquier diferencia que vean, avísennos y la revisamos.',area:'Finanzas'},m);

  const base={marca:'acopio',
    preheader:'Descubierto USD '+repUSD(R.totalDescubierto)+' · '+R.aSeguir.length+' clientes a seguir',
    etiqueta:'Reporte semanal · Insumos',titulo:'Deuda vencida al '+R.fechaTexto,cuerpo};
  const html=MailFyo.armarMail(base);
  const envio=MailFyo.armarEnvio(Object.assign({
    remitente:(destinos&&destinos.remitente)||'',para:(destinos&&destinos.para)||'',cc:(destinos&&destinos.cc)||'',
    asunto:'Deuda vencida al '+R.fechaTexto+' · descubierto USD '+repUSD(R.totalDescubierto)},base));
  // El módulo solo adjunta en línea las imágenes de la marca: los dos gráficos se agregan acá.
  [['fyo-reporte-g1',p1],['fyo-reporte-g2',p2]].forEach(([cid,b64])=>
    envio.envio.message.attachments.push({'@odata.type':'#microsoft.graph.fileAttachment',
      name:cid+'.png',contentType:'image/png',contentBytes:b64,contentId:cid,isInline:true}));

  const previa=MailFyo.vistaPrevia(html)
    .replace('cid:fyo-reporte-g1','data:image/png;base64,'+p1)
    .replace('cid:fyo-reporte-g2','data:image/png;base64,'+p2);
  return{html,envio,previa,g1:p1,g2:p2};
}

// ExcelJS se baja recién cuando hace falta, para no cargarlo en cada visita.
const REP_EXCELJS=['https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
                   'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'];
function cargarExcelJS(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  const probar=i=>new Promise((res,rej)=>{
    if(i>=REP_EXCELJS.length)return rej(new Error('No se pudo cargar ExcelJS. Revisá la conexión o el acceso a los CDN.'));
    const s=document.createElement('script');
    s.src=REP_EXCELJS[i];
    s.onload=()=>window.ExcelJS?res(window.ExcelJS):probar(i+1).then(res,rej);
    s.onerror=()=>probar(i+1).then(res,rej);
    document.head.appendChild(s);
  });
  return probar(0);
}

async function generarExcelReporte(R){
  const EX=await cargarExcelJS();
  const F='Poppins',AR=s=>'FF'+s;
  const C={principal:'34BBA1',texto:'2A9984',carbon:'1E2A2E',gris:'5B6B70',linea:'D5DFE2',niebla:'F1FAF8',blanco:'FFFFFF',
    // Cubierto y Descubierto se destacan con el mismo verde de la marca: un tinte más
    // marcado que el niebla de las filas alternas, y el encabezado un tono más oscuro.
    destacado:'D9F0EA',destacadoAlt:'C9EAE1',destacadoCab:'1F7A68'};
  const COL_DESTACADAS=[6,7];   // índices dentro de ENC: Cubierto y Descubierto
  const fu=(tam,bold,color,ital)=>({name:F,size:tam||10,bold:!!bold,italic:!!ital,color:{argb:AR(color||C.carbon)}});
  const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:AR(c)}});

  const wb=new EX.Workbook();
  wb.creator='fyoAcopio · Finanzas';
  const ws=wb.addWorksheet('Resumen',{views:[{showGridLines:false}],
    pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,
      margins:{left:0.5,right:0.5,top:0.6,bottom:0.6,header:0.3,footer:0.3}}});
  ws.properties.tabColor={argb:AR(C.principal)};

  const ENC=['Cliente','Vencido','0-30','31-60','61-90','+90','Cubierto','Descubierto','Comentarios'];
  const anchos=[30,14,13,13,13,13,14,15,52];
  ws.getColumn(1).width=3;                       // columna de margen, como en la plantilla
  anchos.forEach((w,i)=>{ws.getColumn(i+2).width=w;});
  const ultima=String.fromCharCode(65+ENC.length);

  ws.getRow(1).height=14;ws.getRow(2).height=30;
  const logo=wb.addImage({base64:REP_LOGO_B64,extension:'png'});
  ws.addImage(logo,{tl:{col:1.1,row:1.15},ext:{width:132,height:28}});   // alto fijo 28 px, proporción oficial
  ws.getCell('B4').value='Deuda vencida – Clientes de insumos';ws.getCell('B4').font=fu(18,true,C.texto);
  ws.getRow(4).height=30;
  ws.getCell('B5').value='Solo cuenta corriente vencida al '+R.fechaTexto+', en USD. Se excluyen saldos menores a USD 1.000.';
  ws.getCell('B5').font=fu(10,false,C.gris);
  const cab=ws.getCell(2,ENC.length+1);
  cab.value='Finanzas · '+R.fechaTexto;cab.font=fu(9,false,C.gris);
  cab.alignment={horizontal:'right',vertical:'middle'};
  for(let c=2;c<=ENC.length+1;c++)ws.getCell(6,c).border={bottom:{style:'medium',color:{argb:AR(C.principal)}}};
  ws.getRow(6).height=8;

  const t0=13,ini=t0+1;
  const filas=R.aSeguir.map(c=>[nombreCorto(c.cliente,38),c.vencido,c.buckets[0],c.buckets[1],
    c.buckets[2],c.buckets[3],c.cubierto,c.descubierto,
    (c.incumplimiento?'Entrega vencida · ':'')+c.comentario]);
  const fin=t0+filas.length;
  // Los clientes cubiertos van como filas de detalle agrupadas y plegadas, y la línea
  // resumen va DEBAJO de ellas. Es la convención por defecto de Excel (summaryBelow), y
  // así no hace falta tocar outlineProperties: ExcelJS escribe <outlinePr> después de
  // <pageSetUpPr> dentro de <sheetPr>, y el esquema OOXML exige el orden inverso — con
  // las dos cosas puestas Excel da "contenido ilegible" y repara el archivo.
  const cubs=R.cubiertos||[];
  const rDet=fin+1,rOtros=fin+cubs.length+1,rTot=rOtros+1;

  ws.getRow(8).height=22;ws.getRow(9).height=38;ws.getRow(10).height=20;
  [{col:2,et:'Deuda vencida total',f:'=C'+rTot,fmt:'#,##0',nota:'USD · toda la cartera'},
   {col:4,et:'Descubierto',f:'=I'+rTot,fmt:'#,##0',nota:'USD · sin respaldo'},

  ].forEach(k=>{
    for(const col of[k.col,k.col+1])for(const r of[8,9,10]){
      const c=ws.getCell(r,col);c.fill=fill(C.niebla);
      c.border={left:{style:'thick',color:{argb:AR(C.blanco)}},right:{style:'thick',color:{argb:AR(C.blanco)}}};
      c.alignment={horizontal:'left',vertical:'middle',indent:1};
    }
    ws.mergeCells(8,k.col,8,k.col+1);ws.mergeCells(9,k.col,9,k.col+1);ws.mergeCells(10,k.col,10,k.col+1);
    ws.getCell(8,k.col).value=k.et;ws.getCell(8,k.col).font=fu(9,false,C.gris);
    const v=ws.getCell(9,k.col);v.value={formula:k.f};v.font=fu(20,true,C.texto);v.numFmt=k.fmt;
    ws.getCell(10,k.col).value=k.nota;ws.getCell(10,k.col).font=fu(8,false,C.gris);
  });
  ws.getRow(11).height=18;
  ws.getCell(12,2).value='Detalle por cliente';ws.getCell(12,2).font=fu(12,true);ws.getRow(12).height=24;

  ENC.forEach((h,j)=>{const c=ws.getCell(t0,j+2);
    c.value=h;c.font=fu(10,true,C.blanco);
    c.fill=fill(COL_DESTACADAS.indexOf(j)>=0?C.destacadoCab:C.texto);
    c.alignment={horizontal:(j===0||j===8)?'left':'right',vertical:'middle',indent:1,wrapText:true};});
  ws.getRow(t0).height=28;

  filas.forEach((fila,i)=>{const r=ini+i;ws.getRow(r).height=22;
    fila.forEach((v,j)=>{const c=ws.getCell(r,j+2);
      c.value=v;c.font=fu(10);
      c.border={bottom:{style:'thin',color:{argb:AR(C.linea)}}};
      c.alignment={horizontal:(j===0||j===8)?'left':'right',vertical:'middle',indent:1};
      if(j>=1&&j<=7)c.numFmt='#,##0';
      // Cubierto y Descubierto van tintadas para que se lean como un bloque aparte
      if(COL_DESTACADAS.indexOf(j)>=0)c.fill=fill(i%2?C.destacadoAlt:C.destacado);
      else if(i%2)c.fill=fill(C.niebla);
    });});

  // ── Detalle plegable de los clientes cubiertos ──────────────────────────
  cubs.forEach((c,i)=>{
    const r=rDet+i,row=ws.getRow(r);
    row.height=20;row.outlineLevel=1;row.hidden=true;     // arranca plegado
    [nombreCorto(c.cliente,38),c.vencido,c.buckets[0],c.buckets[1],c.buckets[2],c.buckets[3],
     c.cubierto,c.descubierto,c.comentario].forEach((v,j)=>{
      const cell=ws.getCell(r,j+2);
      cell.value=v;cell.font=fu(9,false,C.gris);
      cell.border={bottom:{style:'thin',color:{argb:AR(C.linea)}}};
      cell.alignment={horizontal:(j===0||j===8)?'left':'right',vertical:'middle',indent:j===0?3:1};
      if(j>=1&&j<=7)cell.numFmt='#,##0';
      if(COL_DESTACADAS.indexOf(j)>=0)cell.fill=fill(C.destacado);
    });
  });

  ws.getRow(rOtros).height=22;
  ['Otros '+R.otros.n+' clientes con vencido cubierto',R.otros.usd,R.otros.buckets[0],R.otros.buckets[1],
   R.otros.buckets[2],R.otros.buckets[3],R.otros.cubierto,R.otros.descubierto,
   'Cheques, contratos o plataformas cubren el vencido; el resto queda bajo el umbral de USD 1.000'
  ].forEach((v,j)=>{const c=ws.getCell(rOtros,j+2);
    c.value=v;c.font=fu(10,false,C.gris,true);
    c.border={bottom:{style:'thin',color:{argb:AR(C.linea)}}};
    c.alignment={horizontal:(j===0||j===8)?'left':'right',vertical:'middle',indent:1};
    if(j>=1&&j<=7)c.numFmt='#,##0';
    if(COL_DESTACADAS.indexOf(j)>=0)c.fill=fill(C.destacadoAlt);});


  ws.getRow(rTot).height=26;
  // El rango salta las filas de detalle y suma aparte la línea resumen: si fuera un rango
  // continuo, al desplegar el grupo cada cliente cubierto se contaría dos veces.
  ['Total'].concat(['C','D','E','F','G','H','I'].map(L=>({formula:'SUM('+L+ini+':'+L+fin+')+'+L+rOtros})))
   .forEach((v,j)=>{const c=ws.getCell(rTot,j+2);
    c.value=v;c.font=fu(10,true);
    c.border={top:{style:'medium',color:{argb:AR(C.texto)}}};
    c.alignment={horizontal:j===0?'left':'right',vertical:'middle',indent:1};
    if(j>=1&&j<=7)c.numFmt='#,##0';
    if(COL_DESTACADAS.indexOf(j)>=0)c.fill=fill(C.destacadoAlt);});

  ws.addConditionalFormatting({ref:'I'+ini+':I'+rOtros,
    rules:[{type:'dataBar',cfvo:[{type:'num',value:0},{type:'max'}],color:{argb:AR(C.principal)},showValue:true,priority:1}]});

  // Gráficos como imagen: ExcelJS no genera gráficos nativos de Excel.
  const e1=svgBarras({categorias:['0-30 días','31-60 días','61-90 días','+90 días'],
    series:[{nombre:'Vencido',valores:R.buckets.map(v=>Math.round(v))}],ancho:5.8,alto:2.7});
  const top8=R.aSeguir.slice(0,8);
  const e2=svgBarras({categorias:top8.map(c=>nombreCorto(c.cliente,14)),
    series:[{nombre:'Vencido',valores:top8.map(c=>Math.round(c.vencido))},
            {nombre:'Descubierto',valores:top8.map(c=>Math.round(c.descubierto))}],
    horizontal:true,ancho:5.8,alto:3.6});
  const b1=await svgAPng(e1),b2=await svgAPng(e2);
  const rG=rTot+3;
  ws.getRow(rG-2).addPageBreak();
  ws.getCell(rG-1,2).value='Vencido por antigüedad y por cliente (USD)';
  ws.getCell(rG-1,2).font=fu(12,true);
  ws.addImage(wb.addImage({base64:b1,extension:'png'}),{tl:{col:1.1,row:rG-1},ext:{width:Math.ceil(e1.w),height:Math.ceil(e1.h)}});
  ws.addImage(wb.addImage({base64:b2,extension:'png'}),{tl:{col:1.1,row:rG+14},ext:{width:Math.ceil(e2.w),height:Math.ceil(e2.h)}});

  const rN=rG+36;
  ['Cubierto = cheques en cartera (RI pendientes de aplicar de la cuenta corriente) + contratos de canje pendientes de entrega + plataformas (Nera / Procampo) informadas en el comentario.',
   'Descubierto = vencido − cubierto, con piso en cero. Se listan los clientes con descubierto de USD 1.000 o más, o con un contrato cuya entrega ya venció.',
   'Fuente: Cta Cte Clientes y Reporte Pos. Contratos de Canje, procesados por el Tablero de Deuda. Los clientes quitados y los comentarios editados a mano en el tablero se respetan tal cual.',
  ].forEach((t,i)=>{const c=ws.getCell(rN+i,2);c.value=t;c.font=fu(8,false,C.gris,true);});

  ws.headerFooter.oddFooter='&L&"Poppins"fyoAcopio · Finanzas&R&"Poppins"&P / &N';
  ws.printArea='A1:'+ultima+(rN+3);

  const wd=wb.addWorksheet('Datos',{views:[{showGridLines:true,state:'frozen',ySplit:1}]});
  ENC.forEach((h,j)=>{const c=wd.getCell(1,j+1);
    c.value=h;c.font=fu(10,true,C.blanco);c.fill=fill(C.texto);
    c.alignment={horizontal:(j===0||j===8)?'left':'right',vertical:'middle'};
    wd.getColumn(j+1).width=anchos[j];});
  wd.getRow(1).height=24;
  filas.forEach((fila,i)=>fila.forEach((v,j)=>{const c=wd.getCell(i+2,j+1);
    c.value=v;c.font=fu(10);if(j>=1&&j<=7)c.numFmt='#,##0';}));
  wd.autoFilter={from:{row:1,column:1},to:{row:filas.length+1,column:ENC.length}};

  const buf=await wb.xlsx.writeBuffer();
  return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}


// ── Salida 3: imagen PNG ───────────────────────────────────────────────────
// Para pegar el reporte directo en el cuerpo del mail. El Outlook nuevo no tiene
// "Insertar como texto" ni abre bien un .eml como borrador, así que una imagen es
// la única forma de que lo que ve el que recibe sea idéntico a lo que se generó.
// El mail se arma igual que siempre y se rasteriza; el detalle completo sigue
// yendo en el Excel adjunto, que sí es texto y se puede filtrar.
const REP_H2C=['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
               'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'];
function cargarH2C(){
  if(window.html2canvas)return Promise.resolve(window.html2canvas);
  const probar=i=>new Promise((res,rej)=>{
    if(i>=REP_H2C.length)return rej(new Error('No se pudo cargar html2canvas. Revisá la conexión o el acceso a los CDN.'));
    const sc=document.createElement('script');sc.src=REP_H2C[i];
    sc.onload=()=>window.html2canvas?res(window.html2canvas):probar(i+1).then(res,rej);
    sc.onerror=()=>probar(i+1).then(res,rej);
    document.head.appendChild(sc);
  });
  return probar(0);
}

const REP_IMG_ANCHO=720;   // 680 del mail + el margen lateral del módulo

async function generarImagenReporte(R){
  const h2c=await cargarH2C();
  const{previa}=await generarMailReporte(R);
  // Va en un iframe para que el reset global del tablero (*{margin:0;padding:0;
  // box-sizing:border-box}) no toque el HTML del mail, que está pensado sin reset.
  const fr=document.createElement('iframe');
  fr.setAttribute('aria-hidden','true');
  Object.assign(fr.style,{position:'fixed',left:'-10000px',top:'0',border:'0',
    width:REP_IMG_ANCHO+'px',height:'800px',visibility:'hidden'});
  document.body.appendChild(fr);
  try{
    await new Promise((res,rej)=>{
      fr.onload=res;fr.onerror=()=>rej(new Error('No se pudo preparar el mail para la imagen.'));
      fr.srcdoc=previa;
    });
    const d=fr.contentDocument;
    // Esperar a que carguen las imágenes incrustadas y la tipografía de marca
    await Promise.all([...d.images].map(im=>im.complete?null:new Promise(r=>{im.onload=im.onerror=r;})));
    if(d.fonts&&d.fonts.ready)await d.fonts.ready;
    await new Promise(r=>setTimeout(r,150));
    const alto=Math.max(d.body.scrollHeight,d.documentElement.scrollHeight);
    fr.style.height=alto+'px';
    const canvas=await h2c(d.body,{backgroundColor:'#E9EDF0',scale:2,useCORS:true,logging:false,
      width:REP_IMG_ANCHO,height:alto,windowWidth:REP_IMG_ANCHO,windowHeight:alto});
    return await new Promise(r=>canvas.toBlob(r,'image/png'));
  }finally{fr.remove();}
}

function repDescargar(blob,nombre){
  const url=URL.createObjectURL(blob);
  Object.assign(document.createElement('a'),{href:url,download:nombre}).click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

const SEG_MIN_USD=100;   // saldo VENCIDO mínimo para entrar a Seguimiento de Cobranza

function SeguimientoView({rows,diasVencidos,seguimiento,onSeguimientoChange}){
  const[search,setSearch]=useState('');
  const[filterEstado,setFilterEstado]=useState('todos');
  const[filterSem,setFilterSem]=useState('todos');

  const[overdueDetail,setOverdueDetail]=useState(null);

  const today=new Date();today.setHours(0,0,0,0);

  // Esta sección gestiona cobranza de deuda VENCIDA: si un cliente no tiene nada
  // vencido no hay qué gestionar, así que no entra. El umbral mide el saldo vencido.
  const enriched=rows.filter(r=>{
    const dv=diasVencidos[r.cliente];
    return dv&&dv.saldoVencido>=SEG_MIN_USD;
  }).map(r=>{
    const dv=diasVencidos[r.cliente];
    const dias=dv?dv.dias:0;
    const sem=getSemaforo(dv?dv.dias:-1);
    const seg=seguimiento[r.cliente]||{};
    const proxContacto=seg.proxContacto?new Date(seg.proxContacto):null;
    const proxVencida=proxContacto&&proxContacto<today;
    return{...r,dias,saldoVencido:dv?dv.saldoVencido:0,sem,seg,proxContacto,proxVencida,factVencidas:dv?dv.factVencidas:[]};
  });

  const criticos=enriched.filter(r=>r.sem.color==='rojo').length;
  const porVencer=enriched.filter(r=>r.sem.color==='amarillo').length;

  let filtered=enriched.filter(r=>{
    if(search&&!r.cliente.toLowerCase().includes(search.toLowerCase()))return false;
    if(filterEstado!=='todos'&&(r.seg.estado||'')!==filterEstado)return false;

// Vista Deuda Vencida
function DeudaVencidaView({rows,corte,onCorte,tc,onTc,precios,dvState,onDvState,sinNegocios}){
  const[search,setSearch]=useState('');
  const[sortKey,setSortKey]=useState('total');
  const[sortDir,setSortDir]=useState('desc');
  const[detail,setDetail]=useState(null);

  // Los quitados a mano no se muestran ni suman. El buscador es aparte.
  const visibles=rows.filter(r=>!r.quitado);
  const quitados=Object.keys(dvState).filter(c=>dvState[c]&&dvState[c].quitado).sort();
  let filtered=visibles.filter(r=>!search||r.cliente.toLowerCase().includes(search.toLowerCase()));
  filtered=[...filtered].sort((a,b)=>{
    if(sortKey==='cliente')return sortDir==='asc'?a.cliente.localeCompare(b.cliente):b.cliente.localeCompare(a.cliente);
    if(sortKey==='total')return sortDir==='asc'?a.total-b.total:b.total-a.total;
    if(typeof sortKey==='number')return sortDir==='asc'?a.buckets[sortKey]-b.buckets[sortKey]:b.buckets[sortKey]-a.buckets[sortKey];
    return 0;
  });

  const tTot=filtered.reduce((s,r)=>s+r.total,0);
  const tBal=i=>filtered.reduce((s,r)=>s+r.buckets[i],0);

  const onSort=k=>{if(sortKey===k)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortKey(k);setSortDir('desc');}};
  const thS=(k,label,cls='')=>h('th',{className:cls,onClick:()=>onSort(k)},label,' ',
    h('span',{className:'sort-arrow'},sortKey===k?(sortDir==='asc'?'↑':'↓'):'↕'));

  const upd=(cliente,field,value)=>onDvState({...dvState,[cliente]:{...(dvState[cliente]||{}),[field]:value}});
  const resetCom=cliente=>{const st={...(dvState[cliente]||{})};delete st.comentario;onDvState({...dvState,[cliente]:st});};
  const quitar=cliente=>upd(cliente,'quitado',true);
  const devolver=cliente=>{const st={...(dvState[cliente]||{})};delete st.quitado;onDvState({...dvState,[cliente]:st});};
  const restaurarTodos=()=>{const n={...dvState};quitados.forEach(c=>{const st={...(n[c]||{})};delete st.quitado;n[c]=st;});onDvState(n);};

  const corteD=parseISODate(corte);

  return h('div',{className:'dv-section'},
    h('div',{className:'dv-params'},
      h('label',{className:'dv-field'},h('span',{},'Fecha de corte'),
        h('input',{type:'date',value:corte||'',onChange:e=>onCorte(e.target.value)})),
      h('label',{className:'dv-field'},h('span',{},'TC Divisa Vend. BNA'),
        h('div',{className:'input-prefix'},h('span',{className:'pfx'},'$'),
          h('input',{type:'number',step:'0.01',value:tc,onChange:e=>onTc(parseFloat(e.target.value)||0),
            style:{fontFamily:'var(--font-mono)',fontSize:'.85rem'}}))),
      h('div',{className:'dv-note'},
        '⚠ El TC se carga a mano: Divisa Vendedor BNA del día anterior al corte → ',
        h('b',{},dvDiaAnterior(corteD)),
        h('br'),
        'Al mover la fecha de corte la deuda se recalcula sola, el TC no.'),
      h('div',{className:'search-wrap',style:{marginLeft:'auto',alignSelf:'center'}},
        h('span',{className:'search-icon'},'🔍'),
        h('input',{type:'text',placeholder:'Buscar cliente…',value:search,onChange:e=>setSearch(e.target.value),className:'search-input'}),
        search&&h('button',{className:'search-clear',onClick:()=>setSearch('')},'✕'))
    ),
    h('div',{className:'params-mini-bar'},
      h('span',{},'📅 Corte '+(corteD?corteD.toLocaleDateString('es-AR'):'—')),
      h('span',{},'💵 TC $'+num(tc).toLocaleString('es-AR')),
      h('span',{},'🌱 Soja USD '+(precios.sojaUSD||0)+'/tn'),
      h('span',{},'🌽 Maíz USD '+(precios.maizUSD||0)+'/tn'),
      h('span',{},'🌾 Trigo USD '+(precios.trigoUSD||0)+'/tn'),
      h('span',{},'📊 '+(quitados.length?filtered.length+' de '+rows.length+' clientes · '+quitados.length+' quitado'+(quitados.length>1?'s':''):filtered.length+' clientes')),
      h('span',{},'🔎 Deuda vencida mín. USD '+DV_MIN_USD.toLocaleString('es-AR')),
    ),
    quitados.length>0&&h('div',{className:'dv-quitados'},
      h('span',{},'🗑 ',h('b',{},quitados.length+(quitados.length>1?' clientes':' cliente')),' quitado'+(quitados.length>1?'s':'')+' del reporte:'),
      quitados.map(c=>h('span',{className:'chip-quitado',key:c},c,
        h('button',{title:'Devolver al reporte',onClick:()=>devolver(c)},'↩'))),
      h('button',{className:'btn-restaurar',onClick:restaurarTodos},'Restaurar todos')
    ),
    h('div',{className:'dv-table-wrap'},
      h('table',{className:'dv-table'},
        h('thead',{},h('tr',{},
          h('th',{className:'dv-c-quitar'},''),
          thS('cliente','Razón Social',''),
          thS('total','Part. Venc. en USD','dv-num dv-c-tot'),
          ...DV_BUCKETS.map((b,i)=>thS(i,b,'dv-num')),
          h('th',{style:{cursor:'default',textAlign:'left',minWidth:'300px'}},'Comentarios'),
        )),
        h('tbody',{},filtered.map(r=>h('tr',{key:r.cliente},
          h('td',{className:'dv-c-quitar'},
            h('button',{className:'dv-quitar',title:'Quitar '+r.cliente+' del reporte',
              onClick:()=>quitar(r.cliente)},'✕')),
          h('td',{},h('div',{className:'dv-cliente',onClick:()=>setDetail(r),title:'Ver detalle'},
            h('span',{className:'cliente-name'},r.cliente))),
          h('td',{className:'dv-num dv-c-tot'},fmtUSD(r.total)),
          ...r.buckets.map((v,i)=>h('td',{key:i,className:'dv-num'},fmtUSD(v,v<0))),
          h('td',{},h('div',{className:'dv-com-wrap'},
            h('input',{className:'dv-com'+(r.editado?' edited':''),value:r.comentario,
              title:r.comentario,
              onChange:e=>upd(r.cliente,'comentario',e.target.value)}),
            r.editado&&h('button',{className:'dv-reset',title:'Volver al comentario automático',
              onClick:()=>resetCom(r.cliente)},'↺')
          ))
        ))),
        h('tfoot',{},h('tr',{className:'dv-totals'},
          h('td',{},''),
          h('td',{},'TOTAL ('+filtered.length+' clientes)'),
          h('td',{className:'dv-num'},fmtUSD(tTot)),
          ...DV_BUCKETS.map((b,i)=>h('td',{key:i,className:'dv-num'},fmtUSD(tBal(i)))),
          h('td',{},''),
        ))
      )
    ),
    h('div',{className:'dv-legend'},
      h('span',{},'Muestra solo cuenta corriente con vencimiento a fecha de corte, inclusive. No incluye Pte de Facturar'+(sinNegocios?' (no se cargó el Excel de Negocios)':'')+'.'),
      h('span',{},'Los cheques y contratos NO se restan: se informan como respaldo en Comentarios, por su total, sin toparlos contra la deuda.'),
      h('span',{},'La suma de los cuatro baldes cierra contra Part. Venc. Solo se listan clientes con deuda vencida mayor a USD '+DV_MIN_USD.toLocaleString('es-AR')+'.'),
      h('span',{},'El botón ✕ quita al cliente del reporte y la exportación a Excel refleja exactamente lo que se ve en pantalla.'),
      h('span',{},'Comentarios editables y guardados en este navegador. El botón ↺ vuelve al automático.'),
    ),
    detail&&h(DVDetailModal,{row:detail,onClose:()=>setDetail(null)})
  );
}

function ReporteView({filas,corte,sinNegocios}){
  const[estado,setEstado]=useState({});          // {tipo:'cargando'|'ok'|'error', msg}
  const[graf,setGraf]=useState(null);
  const[abierto,setAbierto]=useState(false);     // línea "Otros clientes con vencido cubierto"
  const[busqueda,setBusqueda]=useState('');
  const[minDesc,setMinDesc]=useState('');
  const[chip,setChip]=useState('todos');         // 'todos' | 'sincobertura' | 'incumplimiento'
  const[sortKey,setSortKey]=useState('descubierto');
  const[sortDir,setSortDir]=useState('desc');
  const R=useMemo(()=>armarReporte(filas,parseISODate(corte)||new Date()),[filas,corte]);

  // Los gráficos se rasterizan una sola vez por reporte y se reusan en la vista y en las salidas.
  useEffect(()=>{
    let vivo=true;
    (async()=>{
      try{
        const{g1,g2}=repGraficos(R);
        const[a,b]=await Promise.all([svgAPng(g1),svgAPng(g2)]);
        if(vivo)setGraf({g1:a,g2:b});
      }catch(e){if(vivo)setGraf(null);}
    })();
    return()=>{vivo=false;};
  },[R]);

  const correr=async(tipo)=>{
    setEstado({tipo:'cargando',msg:tipo==='excel'?'Armando el Excel…':tipo==='imagen'?'Armando la imagen…':'Armando el mail…'});
    try{
      if(tipo==='imagen'){
        repDescargar(await generarImagenReporte(R),'Reporte_deuda_vencida_'+R.fechaTexto.replace(/\//g,'-')+'.png');
        setEstado({tipo:'ok',msg:'✓ Imagen descargada — copiala y pegala en el cuerpo del mail'});
      }else if(tipo==='excel'){
        repDescargar(await generarExcelReporte(R),'Reporte_deuda_vencida_'+R.fechaTexto.replace(/\//g,'-')+'.xlsx');
        setEstado({tipo:'ok',msg:'✓ Excel descargado'});
      }else if(tipo==='mail'){
        const{previa}=await generarMailReporte(R);
        repDescargar(new Blob([previa],{type:'text/html;charset=utf-8'}),
          'Mail_deuda_vencida_'+R.fechaTexto.replace(/\//g,'-')+'.html');
        setEstado({tipo:'ok',msg:'✓ Mail descargado — abrilo en el navegador para verlo'});
      }else{
        const{envio}=await generarMailReporte(R);
        await navigator.clipboard.writeText(JSON.stringify(envio));
        setEstado({tipo:'ok',msg:'✓ Payload copiado — pegalo en el nodo Code de n8n'});
      }
    }catch(e){setEstado({tipo:'error',msg:'No se pudo generar: '+e.message});}
  };

  const IND=[
    {v:'USD '+repUSD(R.totalVencido),l:'Deuda vencida total'},
    {v:'USD '+repUSD(R.totalDescubierto),l:'Descubierto'},
    {v:(R.pctMas30*100).toFixed(1).replace('.',',')+'%',
     l:'Vencido a +30 días · límite 20%',alerta:!R.dentroDelLimite},
    {v:String(R.aSeguir.length),l:'Clientes a seguir'},
  ];

  const TRAMOS=[0,1,2,3];
  // ── Filtros ──────────────────────────────────────────────────────────────
  // Con algún filtro puesto se busca también entre los clientes cubiertos: si alguien
  // escribe un nombre, espera encontrarlo esté donde esté. Sin filtros, la tabla vuelve
  // al formato del reporte (a seguir arriba, cubiertos resumidos en la última línea).
  const minD=num(minDesc)||0;
  const q=busqueda.trim().toLowerCase();
  const filtrando=!!q||minD>0||chip!=='todos';
  const pasa=c=>{
    if(q&&(c.cliente+' '+c.comentario).toLowerCase().indexOf(q)<0)return false;
    if(minD>0&&c.descubierto<minD)return false;
    if(chip==='sincobertura'&&c.cubierto>0.005)return false;
    if(chip==='incumplimiento'&&!c.incumplimiento)return false;
    return true;
  };
  const ordenar=arr=>{
    const dir=sortDir==='asc'?1:-1;
    return arr.slice().sort((a,b)=>{
      let x,y;
      if(sortKey==='cliente'){return a.cliente.localeCompare(b.cliente)*dir;}
      if(typeof sortKey==='number'){x=a.buckets[sortKey];y=b.buckets[sortKey];}
      else{x=a[sortKey];y=b[sortKey];}
      return (x-y)*dir;
    });
  };
  const base=filtrando?R.aSeguir.concat(R.cubiertos):R.aSeguir;
  const vistas=ordenar(base.filter(pasa));
  const cubiertoDe=new Set(R.cubiertos.map(c=>c.cliente));

  const sum=(arr,f)=>arr.reduce((a,c)=>a+f(c),0);
  const maxDesc=Math.max.apply(null,[1].concat(vistas.map(c=>c.descubierto)));
  const barra=v=>{const p=Math.max(0,Math.min(100,(v/maxDesc)*100));
    return{background:'linear-gradient(90deg, rgba(52,187,161,.38) '+p+'%, transparent '+p+'%)'};};

  const thS=(key,label,ancho)=>h('th',{className:'dv-num',onClick:()=>{
      if(sortKey===key)setSortDir(d=>d==='asc'?'desc':'asc');
      else{setSortKey(key);setSortDir('desc');}
    },style:ancho?{minWidth:ancho}:null},
    label,h('span',{className:'sort-arrow'},sortKey===key?(sortDir==='asc'?'↑':'↓'):'↕'));

  const fila=(c,comoCubierto)=>h('tr',{key:c.cliente,className:comoCubierto?'rep-cubierto':''},
    h('td',{},h('span',{className:'cliente-name'},c.cliente),
      comoCubierto&&h('span',{className:'rep-tag'},'cubierto')),
    h('td',{className:'dv-num'},repUSD(c.vencido)),
    ...TRAMOS.map(i=>h('td',{key:i,className:'dv-num'},repUSD(c.buckets[i]))),
    h('td',{className:'dv-num'},repUSD(c.cubierto)),
    h('td',{className:'dv-num dv-c-tot',style:comoCubierto?null:barra(c.descubierto)},repUSD(c.descubierto)),
    h('td',{},c.comentario));

  return h('section',{className:'results-section'},
    h('div',{className:'rep-bar'},
      h('div',{className:'rep-bar-tit'},
        h('span',{className:'rep-chip'},'📧 Reporte semanal'),
        h('span',{},'Deuda vencida al '+R.fechaTexto),
        h('span',{className:'rep-bar-sub'},'La fecha de corte y el TC se cambian en la pestaña Deuda Vencida')),
      h('div',{className:'rep-acciones'},
        h('button',{className:'btn btn-primary',onClick:()=>correr('mail'),disabled:estado.tipo==='cargando'},'📧 Mail HTML'),
        h('button',{className:'btn btn-primary',onClick:()=>correr('excel'),disabled:estado.tipo==='cargando'},'↓ Excel'),
        h('button',{className:'btn rep-btn-sec',onClick:()=>correr('imagen'),disabled:estado.tipo==='cargando',
          title:'PNG del reporte para pegar directo en el cuerpo del mail'},'🖼 Imagen'),
        h('button',{className:'btn rep-btn-sec',onClick:()=>correr('n8n'),disabled:estado.tipo==='cargando',
          title:'Copia el JSON listo para el nodo Code de n8n (incluye el HTML y las imágenes)'},'⧉ Payload n8n'))),

    estado.msg&&h('div',{className:'rep-estado '+(estado.tipo||'')},
      estado.tipo==='cargando'?h('span',{},h('span',{className:'spinner'}),' ',estado.msg):estado.msg),

    h('div',{className:'rep-kpis'},IND.map((k,i)=>
      h('div',{key:i,className:'rep-kpi'+(k.alerta?' alerta':'')},
        h('div',{className:'rep-kpi-v'},k.v),
        h('div',{className:'rep-kpi-l'},k.l)))),

    h('div',{className:'rep-graficos'},
      graf?[h('img',{key:'a',src:'data:image/png;base64,'+graf.g1,alt:'Vencido por antigüedad'}),
            h('img',{key:'b',src:'data:image/png;base64,'+graf.g2,alt:'Vencido vs. descubierto'})]
        :h('div',{className:'rep-cargando'},'Generando los gráficos…')),

    // ── Barra de filtros ─────────────────────────────────────────────────
    h('div',{className:'rep-filtros'},
      h('div',{className:'search-wrap'},
        h('span',{className:'search-icon'},'🔍'),
        h('input',{type:'text',placeholder:'Buscar cliente o comentario…',value:busqueda,
          onChange:e=>setBusqueda(e.target.value),className:'search-input'}),
        busqueda&&h('button',{className:'search-clear',onClick:()=>setBusqueda('')},'✕')),
      [['todos','Todos'],['sincobertura','Sin cobertura'],['incumplimiento','Con entrega vencida']]
        .map(([k,l])=>h('button',{key:k,className:'filter-chip'+(chip===k?' active':''),
          onClick:()=>setChip(k)},l)),
      h('label',{className:'rep-min'},'Descubierto mín. USD',
        h('input',{type:'number',min:'0',step:'1000',value:minDesc,placeholder:'0',
          onChange:e=>setMinDesc(e.target.value),className:'search-input rep-min-input'})),
      filtrando&&h('button',{className:'btn-restaurar',
        onClick:()=>{setBusqueda('');setMinDesc('');setChip('todos');}},'Limpiar filtros'),
      h('span',{className:'rep-filtros-nota'},
        filtrando?vistas.length+' de '+(R.aSeguir.length+R.cubiertos.length)+' clientes · el mail y el Excel salen igual, sin el filtro'
          :'Clic en el encabezado para ordenar por esa columna')),

    h('div',{className:'dv-table-wrap'},
      h('table',{className:'dv-table rep-table'},
        h('thead',{},h('tr',{},
          h('th',{style:{textAlign:'left'},onClick:()=>{
              if(sortKey==='cliente')setSortDir(d=>d==='asc'?'desc':'asc');
              else{setSortKey('cliente');setSortDir('asc');}}},
            'Cliente',h('span',{className:'sort-arrow'},sortKey==='cliente'?(sortDir==='asc'?'↑':'↓'):'↕')),
          thS('vencido','Vencido'),
          thS(0,'0-30'),thS(1,'31-60'),thS(2,'61-90'),thS(3,'+90'),
          thS('cubierto','Cubierto'),thS('descubierto','Descubierto'),
          h('th',{style:{textAlign:'left',minWidth:'260px',cursor:'default'}},'Comentarios'))),
        h('tbody',{},vistas.length
          ?vistas.map(c=>fila(c,filtrando&&cubiertoDe.has(c.cliente)))
          :[h('tr',{key:'vacio'},h('td',{colSpan:9,className:'rep-vacio'},'Ningún cliente coincide con el filtro.'))]),
        h('tfoot',{},
          // La línea resumen aplica solo sin filtros: con filtros la tabla ya muestra a los cubiertos
          !filtrando&&R.otros.n>0&&h('tr',{className:'rep-otros'+(abierto?' abierto':''),
            onClick:()=>setAbierto(a=>!a),title:abierto?'Ocultar el detalle':'Ver qué clientes son'},
            h('td',{},h('span',{className:'rep-caret'},abierto?'▾':'▸'),
              'Otros '+R.otros.n+' clientes con vencido cubierto'),
            h('td',{className:'dv-num'},repUSD(R.otros.usd)),
            ...TRAMOS.map(i=>h('td',{key:i,className:'dv-num'},repUSD(R.otros.buckets[i]))),
            h('td',{className:'dv-num'},repUSD(R.otros.cubierto)),
            h('td',{className:'dv-num'},repUSD(R.otros.descubierto)),
            h('td',{},abierto?'Cheques, contratos o plataformas cubren el vencido':'Clic para ver el detalle')),
          ...(!filtrando&&abierto?ordenar(R.cubiertos).map(c=>fila(c,true)):[]),
          h('tr',{className:'dv-totals'},
            h('td',{},filtrando?'TOTAL FILTRADO ('+vistas.length+' clientes)':'TOTAL'),
            h('td',{className:'dv-num'},repUSD(filtrando?sum(vistas,c=>c.vencido):R.totalVencido)),
            ...TRAMOS.map(i=>h('td',{key:i,className:'dv-num'},
              repUSD(filtrando?sum(vistas,c=>c.buckets[i]):R.buckets[i]))),
            h('td',{className:'dv-num'},repUSD(filtrando?sum(vistas,c=>c.cubierto)
              :sum(R.aSeguir,c=>c.cubierto)+R.otros.cubierto)),
            h('td',{className:'dv-num'},repUSD(filtrando?sum(vistas,c=>c.descubierto):R.totalDescubierto)),
            h('td',{},''))))),

    R.logistica.length>0&&h('div',{className:'rep-logistica'},
      h('div',{className:'rep-log-tit'},'📦 Pedido a Logística'),
      h('div',{className:'rep-log-sub'},'Contratos a entregar que cubren deuda vencida: hay que asignarles cupo.'),
      h('div',{className:'rep-log-lista'},R.logistica.map((l,i)=>
        h('div',{key:i,className:'rep-log-item'},
          h('span',{className:'rep-log-ctto'},'Ctto '+l.contrato),
          h('span',{},nombreCorto(l.cliente,28)),
          h('span',{className:'rep-log-usd'},'USD '+repUSD(l.usd)),
          l.entregaVencida&&h('span',{className:'rep-flag'},'entrega vencida'))))),

    h('div',{className:'dv-legend'},
      h('span',{},'Importes en USD, exactos. Respeta los clientes quitados con ✕ y los comentarios editados en Deuda Vencida.'),
      h('span',{},'Cubierto = cheques en cartera + contratos pendientes de entrega. Si un cliente no tiene nada cruzado, se toma el importe que figure en su comentario (ahí viven hoy las plataformas Nera / Procampo).'),
      h('span',{},'Se listan los clientes con descubierto de USD '+REP_MIN_DESCUBIERTO.toLocaleString('es-AR')+' o más. Los que tienen el vencido cubierto van a la última línea, que se abre para ver el detalle.'),
      h('span',{},'Los filtros y el orden son solo para mirar en pantalla: el mail y el Excel siempre salen con el reporte completo, ordenado por descubierto.'),
      sinNegocios&&h('span',{},'No se cargó el Excel de Negocios: el reporte toma solo cuenta corriente, igual que Deuda Vencida.'))
  );
}

// ═══ MAIN APP ═══
function App(){
  const[files,setFiles]=useState({ctaCte:null,negocios:null,canjes:null,clientes:null});
  const[params,setParams]=useState({
    fechaTablero:hoyISO(),   // siempre el día en que se entra al tablero
    // Semilla de respaldo: se pisa apenas responden las cotizaciones automáticas
    tc:1498.50,precios:{sojaUSD:340.83,maizUSD:186.98,trigoUSD:214.96}
  });
  const[cotiz,setCotiz]=useState({estado:'cargando',objetivo:diaAnteriorISO(hoyISO())});
  const[granosARS,setGranosARS]=useState(null);   // pizarra cruda, para recalcular si cambia el TC
  const[precAuto,setPrecAuto]=useState(true);     // false apenas el usuario toca un precio a mano
  const[result,setResult]=useState(null);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);
  const[navTab,setNavTab]=useState('tablero');
  const[tab,setTab]=useState('vencido');
  const[search,setSearch]=useState('');
  const[showParams,setShowParams]=useState(true);
  const[filter,setFilter]=useState('todos');
  const[minDeuda,setMinDeuda]=useState('');
  const[colVisible,setColVisible]=useState({});
  const[obs,setObs]=useState({});
  const[detailRow,setDetailRow]=useState(null);
  const[sortKey,setSortKey]=useState('total');
  const[sortDir,setSortDir]=useState('desc');
  const[seguimiento,setSeguimiento]=useState(()=>loadStorage());
  // Deuda Vencida: fecha de corte y TC propios de la sección
  const[consMetrica,setConsMetrica]=useState('deuda');
  const[consCeros,setConsCeros]=useState(true);
  const[dvState,setDvState]=useState(()=>loadDV());
  const[dvCorte,setDvCorte]=useState(params.fechaTablero);
  const[dvTc,setDvTc]=useState(params.tc);

  // Se pone en true cuando se auto-carga un tablero ya PUBLICADO (con su propio fechaTablero/
  // TC/pizarra "congelados" al momento de publicar). Evita que la cotización automática del día
  // de HOY (más abajo) pise esos valores históricos cuando alguien abre el link más tarde.
  const publicadoRef=useRef(false);

  // Al entrar (y al recargar) se piden solas: fecha de hoy, TC y pizarra del día anterior
  const cargarCotiz=useCallback(async()=>{
    const fecha=hoyISO();
    setCotiz(c=>({...c,estado:'cargando',objetivo:diaAnteriorISO(fecha)}));
    const d=await traerCotizaciones(fecha);
    setCotiz({...d,estado:'listo'});
    setParams(p=>{
      if(publicadoRef.current)return p;   // ya hay un tablero publicado cargado: no pisar su TC/fecha
      const tc=(d.dolar&&d.dolar.ok&&d.dolar.valor)?num(d.dolar.valor):p.tc;
      let precios=p.precios;
      if(d.granos&&d.granos.ok&&tc>0){
        const cand={sojaUSD:r2(d.granos.soja/tc),maizUSD:r2(d.granos.maiz/tc),trigoUSD:r2(d.granos.trigo/tc)};
        if(preciosPlausibles(cand)){
          setGranosARS({soja:d.granos.soja,maiz:d.granos.maiz,trigo:d.granos.trigo});
          setPrecAuto(true);precios=cand;
        }else{
          setGranosARS(null);
          setCotiz(c=>({...c,granos:{...d.granos,ok:false},
            errores:[...(c.errores||[]),'Los precios de pizarra recibidos no son plausibles ('+
              Object.values(cand).map(v=>'USD '+v).join(' / ')+'): se descartaron, cargalos a mano.']}));
        }
      }
      return{...p,fechaTablero:fecha,tc,precios};
    });
  },[]);
  useEffect(()=>{cargarCotiz();},[cargarCotiz]);

  // Si se cambia el TC a mano y los precios siguen en automático, se revalorizan solos
  const setTc=useCallback(v=>{
    setParams(p=>{
      const precios=(precAuto&&granosARS&&v>0)
        ?{sojaUSD:r2(granosARS.soja/v),maizUSD:r2(granosARS.maiz/v),trigoUSD:r2(granosARS.trigo/v)}
        :p.precios;
      return{...p,tc:v,precios};
    });
  },[precAuto,granosARS]);
  const setPrecio=useCallback((k,v)=>{setPrecAuto(false);setParams(p=>({...p,precios:{...p.precios,[k]:v}}));},[]);

  useEffect(()=>{saveStorage(seguimiento);},[seguimiento]);
  useEffect(()=>{saveDV(dvState);},[dvState]);

  const allLoaded=!!(files.ctaCte&&files.canjes);   // Negocios y Base de clientes son opcionales; cheques salen de la Cta Cte

  const handleProcess=useCallback(async()=>{
    if(!allLoaded)return;
    setLoading(true);setError(null);
    try{
      const data=await processFiles(files,params);
      setResult(data);setShowParams(false);setTab('vencido');setSearch('');setFilter('todos');setMinDeuda('');
      setDvCorte(params.fechaTablero);setDvTc(params.tc);
    }catch(e){setError('Error procesando los archivos: '+e.message);}
    finally{setLoading(false);}
  },[files,params,allLoaded]);

  // ===== AUTO-CARGA (agregado): trae los archivos ya PUBLICADOS desde /api/archivos/latest =====
  // No reemplaza la carga manual: si falla o todavía no hay nada publicado, los dropzones quedan
  // vacíos y se sigue pudiendo arrastrar los archivos a mano exactamente como antes.
  // Si llegan los archivos obligatorios (Cta Cte, Cheques, Canjes — Negocios sigue opcional),
  // se auto-procesa el tablero sin esperar click en "Generar tablero": así quien solo entra a
  // MIRAR (gerencia, comerciales) ve la vista ya armada apenas abre el link, sin tocar nada.
  const[autoLoad,setAutoLoad]=useState({status:'loading',msg:''});
  useEffect(()=>{
    let activo=true;
    (async()=>{
      try{
        const res=await fetch('/api/archivos/latest',{cache:'no-store'});
        if(!res.ok){
          const err=await res.json().catch(()=>({}));
          const e=new Error(err.error||('status '+res.status));e.status=res.status;throw e;
        }
        const data=await res.json();
        const a=data.archivos||{};
        const tipo='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        const toBlob=b64=>{
          const bin=atob(b64);const bytes=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
          return new Blob([bytes],{type:tipo});
        };
        if(!activo)return;
        const nuevosFiles={
          ctaCte:a.cta_cte?toBlob(a.cta_cte.base64):null,
          negocios:a.negocios?toBlob(a.negocios.base64):null,
          canjes:a.contratos?toBlob(a.contratos.base64):null,
          clientes:a.clientes?toBlob(a.clientes.base64):null,
        };
        setFiles(nuevosFiles);
        // El TC y la pizarra de un tablero PUBLICADO son los que se usaron al generarlo (históricos),
        // no los del día en que alguien lo abre — por eso pisan a la cotización automática de "hoy"
        // y quedan protegidos por publicadoRef para que cargarCotiz no los vuelva a pisar después.
        if(data.params){
          publicadoRef.current=true;
          setParams(p=>({...p,...data.params}));
        }
        setAutoLoad({status:'ok',msg:'✓ Tablero publicado cargado automáticamente'+(data.fecha?(' ('+data.fecha+')'):'')});

        const listosParaProcesar=nuevosFiles.ctaCte&&nuevosFiles.canjes;
        if(listosParaProcesar){
          setLoading(true);
          try{
            const nuevosParams=data.params?{...params,...data.params}:params;
            const processed=await processFiles(nuevosFiles,nuevosParams);
            if(!activo)return;
            setResult(processed);setShowParams(false);
            setDvCorte(nuevosParams.fechaTablero);setDvTc(nuevosParams.tc);
          }catch(e){
            if(activo)setError('Error procesando el tablero publicado: '+e.message);
          }finally{
            if(activo)setLoading(false);
          }
        }
      }catch(e){
        if(!activo)return;
        // 404 = todavía no se publicó nada. Otro error = problema de configuración en Vercel: se muestra tal cual.
        setAutoLoad({status:'error',msg:(e.status===404||!e.status)
          ?'No hay ningún tablero publicado todavía. Subilos a mano abajo, como siempre.'
          :'No se pudo traer el tablero publicado ('+e.message+'). Podés subir los archivos a mano abajo.'});
      }
    })();
    return()=>{activo=false;};
  },[]);
  // ===== FIN AUTO-CARGA =====

  // ===== PUBLICAR (agregado): guarda los archivos + params ya usados en el backend compartido,
  // para que quien abra el link SIN ser parte del equipo que sube archivos (gerencia, comerciales)
  // vea este tablero ya armado apenas entra — sin cargar nada. Requiere la clave TABLERO_API_SECRET
  // (se pide una sola vez y queda guardada en la sesión del navegador).
  const[publishState,setPublishState]=useState({status:'idle',msg:''});
  const fileToBase64=file=>new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
  const handlePublicar=useCallback(async()=>{
    if(!allLoaded||!result)return;
    let secret=sessionStorage.getItem('tablero_publish_secret');
    if(!secret){
      secret=window.prompt('Clave para publicar (la misma configurada como TABLERO_API_SECRET en Vercel):');
      if(!secret)return;
    }
    setPublishState({status:'loading',msg:'Publicando…'});
    try{
      const nombres={
        cta_cte:['ctaCte','Cta_cte_clientes.xlsx'],
        negocios:['negocios','Negocios_ptes_de_facturar.xlsx'],
        contratos:['canjes','Reporte_Pos_Contratos.xlsx'],
        clientes:['clientes','Clientes_cuit.xlsx'],
      };
      const archivos={};
      for(const key in nombres){
        const[fkey,defaultName]=nombres[key];
        const file=files[fkey];
        if(file)archivos[key]={nombre:file.name||defaultName,base64:await fileToBase64(file)};
      }
      const body={
        fecha:params.fechaTablero,
        archivos,
        params:{fechaTablero:params.fechaTablero,tc:params.tc,precios:params.precios},
      };
      const res=await fetch('/api/archivos/update',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-secret':secret},
        body:JSON.stringify(body),
      });
      if(!res.ok){
        if(res.status===401)sessionStorage.removeItem('tablero_publish_secret');
        const err=await res.json().catch(()=>({}));
        throw new Error(err.error||('status '+res.status));
      }
      sessionStorage.setItem('tablero_publish_secret',secret);
      setPublishState({status:'ok',msg:'✓ Publicado — quien abra el link ahora ve este tablero, sin subir nada.'});
    }catch(e){
      setPublishState({status:'error',msg:'Error al publicar: '+e.message});
    }
  },[files,params,allLoaded,result]);
  // ===== FIN PUBLICAR =====

  const handleSort=key=>{if(sortKey===key)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortKey(key);setSortDir('desc');}};

  // Pestañas dinámicas: "Vencido a la fecha" + mes corriente + mes siguiente + meses posteriores con movimientos
  const periods=result?result.periods:[];
  const esCons=tab==='consolidado';
  const activePeriod=esCons?{label:'Consolidado',rows:[]}:(periods.find(p=>p.key===tab)||periods[0]||{label:'',rows:[]});
  const currentRows=esCons?[]:(activePeriod.rows||[]);
  const consData=result?result.consolidado:null;
  const consExport=useMemo(()=>{
    if(!consData)return null;
    return{cols:consData.cols,filas:consFilas(consData,consMetrica,consCeros),
           metrica:(CONS_METRICAS.find(m=>m.k===consMetrica)||{}).l||''};
  },[consData,consMetrica,consCeros]);
  const rowsVencido=(periods[0]||{rows:[]}).rows||[];

  // Se recalcula sola al mover la fecha de corte o el TC — sin volver a cargar los Excel
  const dvAll=useMemo(()=>result?dvRows(result.recs,parseISODate(dvCorte),dvTc,params.precios,dvState):[],
    [result,dvCorte,dvTc,params.precios,dvState]);

  return h('div',{className:'app'},
    h('header',{className:'app-header'},
      h('div',{className:'header-inner'},
        h('div',{className:'header-brand'},
          h('div',{className:'header-logo'},h(LogoFyo,{color:'#ffffff',alto:26})),
          h('span',{className:'brand-div'}),
          h('div',{},h('div',{className:'header-title'},'Tablero de Deuda'),h('div',{className:'header-sub'},'Gestión de clientes · Vista integral'))
        ),
        result&&h('div',{className:'header-nav'},
          h('button',{className:'nav-tab'+(navTab==='tablero'?' active':''),onClick:()=>setNavTab('tablero')},'📊 Tablero'),
          h('button',{className:'nav-tab'+(navTab==='seguimiento'?' active':''),onClick:()=>setNavTab('seguimiento')},'🚨 Seguimiento de Cobranza'),
          h('button',{className:'nav-tab'+(navTab==='deudavencida'?' active':''),onClick:()=>setNavTab('deudavencida')},'📅 Deuda Vencida'),
          h('button',{className:'nav-tab'+(navTab==='reporte'?' active':''),onClick:()=>setNavTab('reporte')},'📧 Reporte de Deuda'),
        ),
        h('div',{className:'header-espacio'})
      ),
      result&&h('div',{className:'header-acciones-fila'},
        h('div',{className:'header-actions'},
          h('button',{className:'btn btn-ghost',onClick:()=>{setResult(null);setShowParams(true);setNavTab('tablero');}},'← Nueva consulta'),
          h('button',{className:'btn btn-ghost',onClick:()=>window.print()},'🖨 PDF'),
          h('button',{className:'btn btn-primary',onClick:()=>exportToExcel(result.periods,params,obs,{rows:dvAll.filter(r=>!r.quitado),corte:dvCorte,tc:dvTc},consExport)},'↓ Exportar Excel'),
          h('button',{className:'btn btn-primary',onClick:handlePublicar,disabled:publishState.status==='loading'},
            publishState.status==='loading'?'Publicando…':'📤 Publicar para compartir'),
        )
      ),
      result&&publishState.status!=='idle'&&h('div',{className:'header-aviso'},
        h('div',{className:'error-msg',style:publishState.status==='ok'?{background:'#f0fdf4',border:'1px solid #86efac',color:'#16a34a'}:publishState.status==='loading'?{background:'#eff6ff',border:'1px solid #93c5fd',color:'#2563eb'}:{}},
          publishState.msg))
    ),

    result&&h('div',{className:'print-head'},
      h('div',{style:{display:'flex',alignItems:'center',gap:'14px'}},
        h(LogoFyo,{color:'#1B9DC9',alto:30}),
        h('div',{},
          h('div',{className:'ph-tit'},'Tablero de Deuda — Clientes'),
          h('div',{className:'ph-sub'},
            navTab==='seguimiento'?'Seguimiento de Cobranza'
            :navTab==='deudavencida'?'Deuda Vencida'
            :navTab==='reporte'?'Reporte semanal de deuda vencida'
            :(esCons?'Consolidado por mes':activePeriod.label)))),
      h('div',{className:'ph-meta'},
        h('div',{},'Fecha del tablero: '+fmtFechaISO(params.fechaTablero)),
        navTab==='deudavencida'?h('div',{},'Corte: '+fmtFechaISO(dvCorte)+' · TC $'+num(dvTc).toLocaleString('es-AR'))
          :h('div',{},'TC $'+num(params.tc).toLocaleString('es-AR')),
        h('div',{},'Emitido el '+new Date().toLocaleDateString('es-AR')))
    ),

    h('main',{className:'app-main'},
      !result&&h('section',{className:'upload-section'},
        h('div',{className:'logo-carga'},h(LogoFyo,{color:'var(--brand)',alto:44})),
        h('div',{className:'section-header'},h('h2',{},'Cargá los archivos'),h('p',{},'Arrastrá o hacé clic en cada zona para seleccionar el Excel correspondiente')),
        h('div',{className:'dropzones-grid'},
          h(DropZone,{label:'Cuenta Corriente Clientes',hint:'Cta_cte_clientes.xlsx',file:files.ctaCte,onFile:f=>setFiles(p=>({...p,ctaCte:f})),icon:'📋'}),
          h(DropZone,{label:'Negocios Ptes de Facturar (opcional)',hint:'Negocios_ptes_de_facturar.xlsx',file:files.negocios,onFile:f=>setFiles(p=>({...p,negocios:f})),icon:'📦'}),
          h(DropZone,{label:'Contratos Canje / FyO / Acopio',hint:'Reporte_Pos_Contratos.xlsx',file:files.canjes,onFile:f=>setFiles(p=>({...p,canjes:f})),icon:'🌾'}),
          h(DropZone,{label:'Base de clientes con CUIT (opcional)',hint:'Si no se carga, usa la base del '+CUIT_BASE_FECHA,file:files.clientes,onFile:f=>setFiles(p=>({...p,clientes:f})),icon:'🪪'}),
        ),
        h('div',{className:'params-toggle-bar'},
          h('button',{className:'btn-toggle',onClick:()=>setShowParams(p=>!p)},showParams?'▲':'▼',' Parámetros del tablero ',h('span',{className:'params-badge'},'TC: $'+params.tc.toLocaleString('es-AR')))
        ),
        showParams&&h(ParamsPanel,{params,onChange:setParams,cotiz,onRefresh:cargarCotiz,onTc:setTc,onPrecio:setPrecio,precAuto,granosAuto:!!granosARS}),
        h('div',{className:'process-row'},
          error&&h('div',{className:'error-msg'},error),
          h('button',{className:'btn btn-process',onClick:handleProcess,disabled:!allLoaded||loading},
            loading?h('span',{},h('span',{className:'spinner'}),' Procesando…'):!allLoaded?'Faltan archivos — cargá Cta Cte y Contratos':'▶  Generar tablero'
          )
        )
      ),

      result&&navTab==='tablero'&&h('section',{className:'results-section'},
        result.chqDiag&&result.chqDiag.n===0&&h('div',{className:'cons-aviso',style:{fontSize:'.8rem'}},
          '⚠️ No se tomó ningún cheque de la Cta Cte. ',
          result.chqDiag.faltan.length
            ?'Al archivo cargado le faltan las columnas: '+result.chqDiag.faltan.join(', ')+'. Tiene que ser la Cta Cte aplicada cruda (bajada de Algoritmo).'
            :(result.chqDiag.riTotal===0
              ?'El archivo no tiene ningún comprobante RI: probablemente es una Cta Cte ya limpiada a mano. Subí la bajada cruda.'
              :('Hay '+result.chqDiag.riTotal+' RI, '+result.chqDiag.riConcepto+' en $ con concepto cheque / RI Interbanking, pero ninguno con saldo pendiente de $1.000 o más.'))),
        result.sinNegocios&&h('div',{className:'dv-banner'},
          '⚠ No se cargó el Excel de Negocios Ptes de Facturar: la columna "Pte de Facturar" queda en cero en todas las pestañas. La sección Deuda Vencida no lo usa.'),
        esCons?h('div',{className:'summary-strip',style:{gridTemplateColumns:'repeat(3,1fr)'}},
          h(SummaryCard,{label:(consData&&consData.cols[0]?consData.cols[0].label:'Mes corriente')+' · con lo vencido',
            value:(consExport?consExport.filas.reduce((a,f)=>a+(f.vals[0]||0),0):0),
            sub:(consExport?consExport.filas.length:0)+' clientes'}),
          h(SummaryCard,{label:'Meses siguientes',
            value:(consExport?consExport.filas.reduce((a,f)=>a+f.vals.slice(1).reduce((x,y)=>x+y,0),0):0),
            sub:Math.max(0,(consData?consData.cols.length:1)-1)+' meses',accent:'green'}),
          h(SummaryCard,{label:'Total consolidado',
            value:(consExport?consExport.filas.reduce((a,f)=>a+f.tot,0):0),
            sub:(consExport?consExport.metrica:'')+' · suma de todas las columnas',accent:'navy'}),
        ):h('div',{className:'summary-strip'},
          h(SummaryCard,{label:'Deuda total · '+activePeriod.label,value:sumCol(currentRows,'deuda'),sub:currentRows.length+' clientes'}),
          h(SummaryCard,{label:'Cheques / Interbanking',value:Math.abs(sumCol(currentRows,'chq')),sub:'RI de la Cta Cte pendientes de aplicar',accent:'green'}),
          h(SummaryCard,{label:'Contratos de canje',value:Math.abs(sumCol(currentRows,'canje')),sub:'Con IVA 10,5%',accent:'green'}),
          h(SummaryCard,{label:'TOTAL GENERAL',value:sumCol(currentRows,'total'),sub:'Deuda neta a cobrar',accent:'navy'}),
        ),
        h('div',{className:'toolbar'},
          h('div',{className:'toolbar-left'},
            h('div',{className:'tabs'},
              periods.map(p=>h('button',{key:p.key,className:'tab'+(tab===p.key?' active':''),
                onClick:()=>{setTab(p.key);setSearch('');}},
                p.label,h('span',{className:'tab-badge'},(p.rows||[]).length))),
              h('button',{key:'consolidado',className:'tab'+(esCons?' active':''),
                onClick:()=>{setTab('consolidado');setSearch('');}},'📊 Consolidado')
            ),
          ),
          h('div',{className:'toolbar-right'},
            h('div',{className:'search-wrap'},
              h('span',{className:'search-icon'},'🔍'),
              h('input',{type:'text',placeholder:'Buscar cliente…',value:search,onChange:e=>setSearch(e.target.value),className:'search-input'}),
              search&&h('button',{className:'search-clear',onClick:()=>setSearch('')},'✕'),
            ),
            h(ColToggle,{visible:colVisible,onChange:setColVisible}),
          )
        ),
        !esCons&&h('div',{className:'filter-bar'},
          h('span',{className:'filter-bar-title'},'Filtros:'),
          ['todos','conCheques','conCanjes','sinCobertura'].map(f=>h('button',{key:f,className:'filter-chip'+(filter===f?' active':''),onClick:()=>setFilter(f)},
            {todos:'Todos',conCheques:'Con cheques',conCanjes:'Con canjes',sinCobertura:'Sin cobertura'}[f]
          )),
          h('div',{className:'filter-sep'}),
          h('div',{className:'filter-amount'},h('span',{},'Deuda mín:'),
            h('input',{type:'number',placeholder:'USD 0',value:minDeuda,onChange:e=>setMinDeuda(e.target.value)}),
            minDeuda&&h('button',{className:'filter-chip',onClick:()=>setMinDeuda('')},'✕')
          )
        ),
        !esCons&&h('div',{className:'params-mini-bar'},
          h('span',{},'📅 Tablero al '+fmtFechaISO(params.fechaTablero)),
          h('span',{},'💵 TC $'+params.tc.toLocaleString('es-AR')),
          h('span',{},'🌱 Soja USD '+(params.precios.sojaUSD||0)+'/tn'),
          h('span',{},'🌽 Maíz USD '+(params.precios.maizUSD||0)+'/tn'),
          h('span',{},'🌾 Trigo USD '+(params.precios.trigoUSD||0)+'/tn'),
        ),
        esCons
          ?h(ConsolidadoView,{cons:consData,search,metrica:consMetrica,onMetrica:setConsMetrica,
              ceros:consCeros,onCeros:setConsCeros,fechaTablero:params.fechaTablero,
              onDetalle:f=>{if(f.cells.some(Boolean))setDetailRow(unirCeldas(f.cliente,f.cells));}})
          :h(DataTable,{
            rows:currentRows,search,filter,minDeuda,colVisible,obs,
            onObsChange:(c,v)=>setObs(o=>({...o,[c]:v})),
            onDetail:setDetailRow,sortKey,sortDir,onSort:handleSort
          }),
        !esCons&&h('div',{className:'legend-bar'},
          h('span',{className:'leg red'},'Rojo = deuda a cobrar'),h('span',{className:'leg green'},'Verde = saldo a favor'),
          h('span',{className:'leg'},'Clic en cliente para ver detalle · Cheques solo tipo "T", ubicados por fecha de pago · IVA Fert 10,5% · Agroquím 21% · Canjes 10,5% · Detalle ordenado del más vencido al más reciente'),
        )
      ),

      result&&navTab==='seguimiento'&&h(SeguimientoView,{
        rows:rowsVencido,diasVencidos:result.diasVencidos,
        seguimiento,onSeguimientoChange:setSeguimiento,
      }),

      result&&navTab==='deudavencida'&&h(DeudaVencidaView,{
        rows:dvAll,corte:dvCorte,onCorte:setDvCorte,tc:dvTc,onTc:setDvTc,
        precios:params.precios,dvState,onDvState:setDvState,sinNegocios:result.sinNegocios,
      }),

      result&&navTab==='reporte'&&h(ReporteView,{
        filas:dvAll,corte:dvCorte,sinNegocios:result.sinNegocios,
      }),
    ),

    h('footer',{className:'app-footer'},'📍 Tablero de Deuda · fyo acopio · Procesamiento 100% local · Gestión de cobranza guardada en este navegador'),
    detailRow&&h(DetailModal,{row:detailRow,onClose:()=>setDetailRow(null)})
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
