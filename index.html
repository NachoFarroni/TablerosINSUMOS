<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tablero de Deuda — Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<!-- Poppins: tipografía oficial de FYO. Es la misma que usan los gráficos del reporte. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2744;--navy-mid:#1a3a5c;--navy-light:#234872;
  /* Azul de marca fyo — si te pasan el código exacto, cambialo solo acá */
  --brand:#1B9DC9;--brand-dark:#10789e;--brand-soft:#e3f3fa;
  --blue:#1B9DC9;--blue-light:#38b0d8;
  --sky:#e0eeff;--sky-dark:#bfdbfe;
  --white:#fff;--gray-50:#f8fafc;--gray-100:#f1f5f9;
  --gray-200:#e2e8f0;--gray-400:#94a3b8;--gray-600:#475569;--gray-800:#1e293b;
  --red:#dc2626;--red-light:#fef2f2;--green:#16a34a;--green-light:#f0fdf4;
  --amber:#d97706;--amber-light:#fffbeb;--amber-dark:#92400e;
  --font-sans:'Poppins',system-ui,sans-serif;--font-mono:'Poppins',system-ui,sans-serif;
  --radius:8px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.10);--shadow-lg:0 10px 30px rgba(0,0,0,.18);
}
html{font-size:15px}
.data-table td,.data-table th,.seg-table td,.dv-table td,.cons td,.cons th,.sc-value,.msc-value,.mini-table td,.params-mini-bar span{font-variant-numeric:tabular-nums}
body{font-family:var(--font-sans);background:var(--gray-50);color:var(--gray-800);line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--gray-100)}::-webkit-scrollbar-thumb{background:var(--gray-400);border-radius:3px}
.app{display:flex;flex-direction:column;min-height:100vh}
.app-main{flex:1;max-width:1500px;margin:0 auto;width:100%;padding:0 24px 48px}
.app-header{background:var(--brand);border-bottom:3px solid var(--brand-dark);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.header-inner{max-width:1500px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.header-brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.header-logo{display:flex;align-items:center}
.brand-div{width:1px;height:26px;background:rgba(255,255,255,.28);flex-shrink:0}
.logo-carga{display:flex;justify-content:center;margin-bottom:22px}
.header-title{font-size:1.05rem;font-weight:700;color:var(--white);letter-spacing:-.02em}
.header-sub{font-size:.7rem;color:rgba(255,255,255,.82);margin-top:1px}
.header-nav{display:flex;gap:2px;background:rgba(255,255,255,.16);border-radius:10px;padding:3px}
.nav-tab{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:var(--font-sans);font-size:.82rem;font-weight:600;color:rgba(255,255,255,.85);padding:7px 14px;border-radius:8px;transition:all .15s;white-space:nowrap}
.nav-tab.active{background:var(--white);color:var(--brand-dark);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.nav-tab:hover:not(.active){background:rgba(255,255,255,.22);color:var(--white)}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-family:var(--font-sans);font-size:.82rem;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--navy);color:var(--white)}.btn-primary:hover{background:var(--navy-mid)}
.btn-ghost{background:rgba(255,255,255,.18);color:var(--white);border:1px solid rgba(255,255,255,.3)}.btn-ghost:hover{background:rgba(255,255,255,.18)}
.btn-process{background:var(--navy);color:var(--white);padding:14px 36px;font-size:1rem;border-radius:10px;box-shadow:0 4px 14px rgba(37,99,235,.3);transition:all .2s}
.btn-process:hover:not(:disabled){background:var(--navy-mid);transform:translateY(-1px)}
.btn-process:disabled{background:var(--gray-400);cursor:not-allowed;box-shadow:none}
.btn-toggle{background:none;border:none;cursor:pointer;font-family:var(--font-sans);font-size:.875rem;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px;padding:0}
.btn-toggle:hover{color:var(--blue)}
.upload-section{padding-top:40px}
.section-header{margin-bottom:28px}
.section-header h2{font-size:1.6rem;font-weight:700;color:var(--navy);letter-spacing:-.03em}
.section-header p{color:var(--gray-600);margin-top:6px;font-size:.9rem}
.dropzones-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
@media(max-width:900px){.dropzones-grid{grid-template-columns:repeat(2,1fr)}}
.dropzone{border:2px dashed var(--gray-200);border-radius:var(--radius-lg);background:var(--white);padding:28px 16px 24px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow)}
.dropzone:hover{border-color:var(--blue-light);background:var(--sky);transform:translateY(-2px)}
.dropzone.drag{border-color:var(--blue);background:var(--sky)}
.dropzone.has-file{border-color:#16a34a;border-style:solid;background:#f0fdf4}
.dz-icon{font-size:2rem;margin-bottom:4px}.dz-label{font-size:.85rem;font-weight:700;color:var(--navy);line-height:1.3}
.dz-hint{font-size:.75rem;color:var(--gray-400);font-family:var(--font-mono)}.dz-file{font-size:.75rem;color:var(--green);font-weight:600;word-break:break-all}
.params-toggle-bar{margin-bottom:12px;display:flex;align-items:center;gap:12px}
.params-badge{font-family:var(--font-mono);font-size:.75rem;background:var(--sky);color:var(--navy);padding:2px 8px;border-radius:20px;font-weight:600}
.params-panel{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:28px;box-shadow:var(--shadow)}
.params-title{font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.params-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
.param-group{display:flex;flex-direction:column;gap:6px}
.param-group>span{font-size:.75rem;font-weight:600;color:var(--gray-600);text-transform:uppercase;letter-spacing:.04em}
.param-group input{border:1px solid var(--gray-200);border-radius:var(--radius);padding:7px 9px;font-family:var(--font-mono);font-size:.85rem;color:var(--navy);background:var(--gray-50);width:100%}
.param-group input:focus{outline:none;border-color:var(--blue);background:var(--white)}
.input-prefix{display:flex;align-items:center;border:1px solid var(--gray-200);border-radius:var(--radius);background:var(--gray-50);overflow:hidden}
.input-prefix:focus-within{border-color:var(--blue);background:var(--white)}
.input-prefix>.pfx{padding:7px 9px;font-size:.82rem;color:var(--gray-400);font-weight:600;background:var(--gray-100);border-right:1px solid var(--gray-200);white-space:nowrap}
.input-prefix input{border:none!important;border-radius:0!important;background:transparent!important;flex:1;padding:7px 9px;font-family:var(--font-mono);font-size:.85rem;color:var(--navy)}
.input-prefix input:focus{outline:none}
.params-preview{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-100);flex-wrap:wrap}
.params-preview span{font-family:var(--font-mono);font-size:.78rem;color:var(--gray-600);background:var(--sky);padding:3px 9px;border-radius:20px;font-weight:500}
.process-row{display:flex;flex-direction:column;align-items:center;gap:14px}
.error-msg{background:#fef2f2;border:1px solid #fca5a5;border-radius:var(--radius);color:var(--red);padding:10px 16px;font-size:.875rem;width:100%}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--white);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.results-section{padding-top:32px}
.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:900px){.summary-strip{grid-template-columns:repeat(2,1fr)}}
.summary-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--gray-200)}
.summary-card.green{border-top-color:var(--brand)}.summary-card.navy{border-top-color:var(--navy);background:var(--navy)}.summary-card.red{border-top-color:var(--red)}
.sc-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);margin-bottom:5px}
.summary-card.navy .sc-label{color:var(--sky-dark)}
.sc-value{font-family:var(--font-mono);font-size:1.15rem;font-weight:700;color:var(--navy)}
.summary-card.navy .sc-value{color:var(--white)}
.sc-sub{font-size:.7rem;color:var(--gray-400);margin-top:3px}.summary-card.navy .sc-sub{color:var(--sky-dark);opacity:.8}
/* Tabs strip with all months */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
.toolbar-right{display:flex;align-items:center;gap:8px}
.tabs{display:flex;background:var(--gray-100);border-radius:var(--radius);padding:3px;flex-wrap:wrap;gap:2px}
.tab{background:none;border:none;cursor:pointer;font-family:var(--font-sans);font-size:.78rem;font-weight:600;color:var(--gray-600);padding:6px 10px;border-radius:6px;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tab.active{background:var(--white);color:var(--navy);box-shadow:var(--shadow)}
.tab-badge{font-size:.65rem;background:var(--brand-soft);color:var(--brand-dark);padding:1px 5px;border-radius:20px;font-weight:700}
.tab.active .tab-badge{background:var(--brand);color:var(--white)}
.filter-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.filter-bar-title{font-size:.73rem;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.filter-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;border:1px solid var(--gray-200);background:var(--gray-50);font-size:.73rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font-sans);color:var(--gray-600)}
.filter-chip.active{background:var(--navy);color:var(--white);border-color:var(--navy)}
.filter-chip:hover:not(.active){background:var(--sky);border-color:var(--blue-light)}
.filter-sep{width:1px;height:18px;background:var(--gray-200);margin:0 4px}
.filter-amount{display:flex;align-items:center;gap:5px;font-size:.73rem;color:var(--gray-600)}
.filter-amount input{width:100px;padding:4px 7px;border:1px solid var(--gray-200);border-radius:var(--radius);font-family:var(--font-mono);font-size:.73rem;background:var(--gray-50)}
.filter-amount input:focus{outline:none;border-color:var(--blue)}
.search-wrap{position:relative;display:flex;align-items:center}
.search-icon{position:absolute;left:9px;font-size:.8rem;pointer-events:none}
.search-input{border:1px solid var(--gray-200);border-radius:var(--radius);padding:7px 28px;font-family:var(--font-sans);font-size:.8rem;width:190px;background:var(--white)}
.search-input:focus{outline:none;border-color:var(--blue)}
.search-clear{position:absolute;right:7px;background:none;border:none;cursor:pointer;font-size:.72rem;color:var(--gray-400);padding:2px}
.col-toggle-wrap{position:relative}
.col-toggle-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--gray-200);background:var(--white);font-size:.73rem;font-weight:600;cursor:pointer;color:var(--gray-600);font-family:var(--font-sans)}
.col-toggle-btn:hover{border-color:var(--blue-light);background:var(--sky)}
.col-dropdown{position:absolute;right:0;top:calc(100% + 6px);background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:8px;z-index:50;min-width:190px}
.col-dropdown label{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;cursor:pointer;font-size:.78rem;color:var(--gray-800)}
.col-dropdown label:hover{background:var(--gray-50)}
.col-dropdown input[type=checkbox]{accent-color:var(--blue);width:13px;height:13px}
.params-mini-bar{display:flex;gap:12px;background:var(--navy);border-radius:var(--radius) var(--radius) 0 0;padding:6px 12px;flex-wrap:wrap}
.params-mini-bar span{font-family:var(--font-mono);font-size:.71rem;color:var(--sky-dark);font-weight:500}
.table-wrap{overflow-x:auto;border-radius:0 0 var(--radius-lg) var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--gray-200);border-top:none}
.data-table{width:100%;border-collapse:collapse;font-size:.79rem;background:var(--white)}
.data-table thead th{background:var(--navy-light);color:var(--white);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:9px 11px;white-space:nowrap;cursor:pointer;user-select:none}
.data-table thead th:hover{background:var(--navy-mid)}
.data-table thead th.col-deuda{background:var(--navy-mid)}.data-table thead th.col-total{background:#0a1f3d}
.sort-arrow{margin-left:3px;opacity:.6;font-size:.65rem}
.col-cliente{text-align:left;min-width:220px}.col-num{text-align:right;min-width:125px;white-space:nowrap}
tbody .col-deuda{background:rgba(224,238,255,.4)}tbody .col-total{background:rgba(224,238,255,.25)}
.data-table tbody td{padding:7px 11px;border-bottom:1px solid var(--gray-100);font-family:var(--font-mono);font-size:.77rem}
.td-cliente{font-family:var(--font-sans)!important;font-size:.79rem!important;color:var(--navy);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px}
.td-cliente:hover .cliente-name{text-decoration:underline;color:var(--blue)}
.detail-btn{font-size:.6rem;background:var(--sky);color:var(--blue);padding:2px 5px;border-radius:4px;font-weight:700;white-space:nowrap;flex-shrink:0}
.row-alt{background:var(--gray-50)}.data-table tbody tr:hover{background:var(--sky)!important}
.cell-red{color:var(--red);font-weight:600}.cell-green{color:var(--green);font-weight:600}.cell-zero{color:var(--gray-400)}.cell-deuda{color:var(--navy);font-weight:600}
.obs-input{width:100%;border:none;background:transparent;font-family:var(--font-sans);font-size:.74rem;color:var(--gray-800);padding:2px 4px;border-radius:4px}
.obs-input:focus{outline:1px solid var(--blue);background:var(--white)}
.totals-row{background:var(--navy)!important;position:sticky;bottom:0}
.totals-row td{color:var(--white)!important;font-family:var(--font-mono)!important;font-weight:700!important;font-size:.77rem!important;padding:9px 11px!important;border-bottom:none!important;white-space:nowrap}
.total-red{color:#fca5a5!important}.total-green{color:#86efac!important}
.empty-table{text-align:center;padding:48px;color:var(--gray-400);font-size:.9rem;background:var(--white);border:1px solid var(--gray-200);border-top:none;border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.legend-bar{display:flex;gap:14px;margin-top:8px;padding:7px 12px;background:var(--gray-100);border-radius:var(--radius);flex-wrap:wrap}
.leg{font-size:.7rem;color:var(--gray-600)}.leg.red::before{content:'● ';color:var(--red)}.leg.green::before{content:'● ';color:var(--green)}
/* SEGUIMIENTO */
.seg-section{padding-top:32px}
.alert-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
@media(max-width:700px){.alert-strip{grid-template-columns:1fr}}
.alert-card{border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.alert-card.rojo{background:var(--red-light);border:1px solid #fca5a5}
.alert-card.amarillo{background:var(--amber-light);border:1px solid #fcd34d}
.alert-card.verde{background:var(--green-light);border:1px solid #86efac}
.alert-icon{font-size:1.8rem;flex-shrink:0}
.alert-count{font-size:1.35rem;font-weight:700;line-height:1}
.alert-card.rojo .alert-count{color:var(--red)}.alert-card.amarillo .alert-count{color:var(--amber-dark)}.alert-card.verde .alert-count{color:var(--green)}
.alert-label{font-size:.73rem;font-weight:600;color:var(--gray-600);margin-top:2px}
.alert-sub{font-size:.68rem;color:var(--gray-400);margin-top:1px}
.semaforo{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap}
.semaforo.rojo{background:var(--red-light);color:var(--red);border:1px solid #fca5a5}
.semaforo.amarillo{background:var(--amber-light);color:var(--amber-dark);border:1px solid #fcd34d}
.semaforo.verde{background:var(--green-light);color:var(--green);border:1px solid #86efac}
.estado-select{border:1px solid var(--gray-200);border-radius:var(--radius);padding:4px 7px;font-family:var(--font-sans);font-size:.72rem;background:var(--white);cursor:pointer;width:100%;min-width:130px}
.estado-select:focus{outline:none;border-color:var(--blue)}
.estado-pendiente{border-color:#fca5a5;background:#fff5f5;color:var(--red)}
.estado-contactado{border-color:#fcd34d;background:var(--amber-light);color:var(--amber-dark)}
.estado-comprometido{border-color:#86efac;background:var(--green-light);color:var(--green)}
.estado-disputa{border-color:#c4b5fd;background:#f5f3ff;color:#6d28d9}
.fecha-input{border:1px solid var(--gray-200);border-radius:var(--radius);padding:4px 7px;font-family:var(--font-mono);font-size:.72rem;background:var(--white);width:100%;min-width:110px}
.fecha-input:focus{outline:none;border-color:var(--blue)}
.fecha-vencida{border-color:#fca5a5;background:#fff5f5;color:var(--red)}
.seg-table-wrap{overflow-x:auto;border-radius:0 0 var(--radius-lg) var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid var(--gray-200);border-top:none}
.seg-table{width:100%;border-collapse:collapse;font-size:.77rem;background:var(--white)}
.seg-table thead th{background:var(--navy-light);color:var(--white);font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:9px 11px;white-space:nowrap;cursor:pointer}
.seg-table thead th:hover{background:var(--navy-mid)}
.seg-table tbody td{padding:7px 9px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.seg-table tbody tr:nth-child(even){background:var(--gray-50)}.seg-table tbody tr:hover{background:var(--sky)!important}
.seg-table tfoot td{padding:9px 11px;background:var(--navy);color:var(--white);font-family:var(--font-mono);font-weight:700;font-size:.75rem}
.dias-badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:.7rem;font-weight:700;font-family:var(--font-mono)}
.dias-badge.rojo{background:var(--red-light);color:var(--red)}
.dias-badge.amarillo{background:var(--amber-light);color:var(--amber-dark)}
.dias-badge.verde{background:var(--green-light);color:var(--green)}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:1000px;overflow:hidden;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{background:var(--navy);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.modal-title{color:var(--white);font-size:.98rem;font-weight:700}.modal-sub{color:var(--sky-dark);font-size:.74rem;margin-top:2px}
.modal-close{background:rgba(255,255,255,.15);border:none;color:var(--white);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(255,255,255,.25)}
.modal-body{padding:18px 20px}
.modal-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:700px){.modal-summary{grid-template-columns:repeat(2,1fr)}}
.modal-sum-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius);padding:10px 12px}

<body><div id="root"></div>
<script>
// ═══ STORAGE ═══
const STORAGE_KEY='tablero_seguimiento_v1';
const STORAGE_KEY_LEGACY='tablero_seg_v2';
function loadStorage(){
  try{
    let d=localStorage.getItem(STORAGE_KEY);
    if(!d){ // migración desde la clave anterior
      const old=localStorage.getItem(STORAGE_KEY_LEGACY);
      if(old){localStorage.setItem(STORAGE_KEY,old);d=old;}
    }
    return d?JSON.parse(d):{};
  }catch(e){return{}}
}
function saveStorage(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}catch(e){}}

// ═══ HELPERS ═══
function parseDate(v){
  if(!v)return null;if(v instanceof Date)return v;
  if(typeof v==='number'){const d=new Date((v-25569)*86400*1000);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}
  const s=v.toString().trim();
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s);return isNaN(d)?null:d;
}
function fmtDate(v){const d=parseDate(v);if(!d)return '';return d.toLocaleDateString('es-AR');}
function inPeriod(v,s,e){const d=parseDate(v);if(!d)return false;const t=d.getTime();return t>=(s?s.getTime():-Infinity)&&t<=(e?e.getTime():Infinity);}
function num(v){
  if(v===null||v===undefined||v==='')return 0;
  if(typeof v==='number')return isFinite(v)?v:0;
  let s=v.toString().trim().replace(/\s| /g,'');
  if(!s)return 0;
  const hasDot=s.includes('.'),hasComma=s.includes(',');
  if(hasDot&&hasComma){                       // "1.234.567,89" → miles con punto
    s=s.replace(/\./g,'').replace(',','.');
  }else if(hasComma){                          // "1234,89" → decimal con coma
    s=s.replace(',','.');
  }
  const n=parseFloat(s);return isNaN(n)?0:n;
}
function findCol(h,cands){for(const c of cands){const re=new RegExp(c,'i');const i=h.findIndex(x=>re.test((x||'').toString().trim()));if(i>=0)return i;}return -1;}
function sheetToRows(wb){const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,defval:null});}
function fmtUSD(v,signed=false){if(Math.abs(v)<0.005)return '—';const abs=Math.abs(v).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});return(signed&&v<0?'-':'')+'$'+abs;}
function fmtNum(v,dec=2){if(!v&&v!==0)return '—';return num(v).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec});}

// DEDUP_MAP: solo para anomalías REALES que la normalización no puede resolver sola
// (nombres truncados, duplicados de sufijo societario, alias comerciales distintos).
// Todo lo demás (may/min, tildes, puntuación, "S.A." vs "SA" vs "S A" vs "SOCIEDAD ANONIMA",
// espacios) lo resuelve normalizeClientName() automáticamente, para que no haya que
// parchear cliente por cliente cada vez que aparece una variante nueva.
const DEDUP_MAP={
  'AGROTECNICA COMERCIAL SRL (AGROTECNICA COMERCIA':'AGROTECNICA COMERCIAL SRL', // nombre truncado en un archivo
  'TERRA VERDE AGRO INSUMOS SA SA':'TERRA VERDE AGRO INSUMOS SA', // sufijo "SA" duplicado por error de carga
  // Razón social completa vs. acrónimo: ninguna regla general puede unirlas
  'CRESUD SA COMERCIAL INMOBILIARIA FINANCIERA Y AGROPECUARIA':'CRESUD SACIF Y A',
};

// Formas societarias completas → abreviatura, para unificar "SOCIEDAD ANONIMA" con "SA", etc.
const LEGAL_FORMS=[
  [/\bSOCIEDAD DE RESPONSABILIDAD LIMITADA\b/g,'SRL'],
  [/\bSOCIEDAD EN COMANDITA POR ACCIONES\b/g,'SCA'],
  [/\bSOCIEDAD EN COMANDITA POR AC\b/g,'SCA'],   // variante truncada vista en archivos reales
  [/\bSOCIEDAD ANONIMA\b/g,'SA'],
];

function normalizeClientName(n){
  let s=(n||'').toString().trim().toUpperCase();
  s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');   // saca tildes/diéresis
  s=s.replace(/[.,]/g,'');                                // saca puntos y comas (S.A. → SA, Hnos. → Hnos)
  s=s.replace(/\s+/g,' ').trim();
  LEGAL_FORMS.forEach(([re,rep])=>{s=s.replace(re,rep);});
  // Colapsa sufijos societarios escritos con espacios: "S A"→"SA", "S R L"→"SRL", "S C A"→"SCA"
  s=s.replace(/\bS\s+A\b$/,'SA').replace(/\bS\s+R\s+L\b$/,'SRL').replace(/\bS\s+C\s+A\b$/,'SCA');
  s=s.replace(/\s+/g,' ').trim();
  return s;
}
function canonical(n){const s=normalizeClientName(n);return DEDUP_MAP[s]||s;}

// ═══ CUIT ═══
// El CUIT es la clave más confiable para unir un cliente entre archivos: el nombre
// cambia de escritura según el sistema ("S.A." / "SA" / "SOCIEDAD ANONIMA"), el CUIT no.
function cuitDigits(v){const s=(v==null?'':v.toString()).replace(/\D/g,'');return s.length===11?s:'';}
function fmtCuit(d){return d&&d.length===11?d.slice(0,2)+'-'+d.slice(2,10)+'-'+d.slice(10):'';}

// Une a cada registro con su cliente usando el CUIT cuando lo tiene.
// 1) La Cta Cte manda: el primer nombre visto para un CUIT es el nombre del cliente.
// 2) Contratos / cheques / negocios con CUIT se pegan a ese cliente aunque el nombre esté escrito distinto.
// 3) Los registros SIN CUIT siguen uniendo por nombre normalizado, como antes, y además
//    aprovechan los alias que dejó el paso 2 (ej. cheque a nombre "TOSQUITA CEREALES SA").
// 4) Si dos CUIT distintos tienen el mismo nombre, NO se mezclan: el segundo queda como
//    "NOMBRE (CUIT)" y se avisa.
function resolverClientes(recCta,otras){
  const keyPorCuit={},cuitPorKey={},alias={},avisos=[],vistos=new Set();
  const asignar=(r,origen)=>{
    const cu=r._cuit;if(!cu)return;
    const orig=r._c;
    let k=keyPorCuit[cu];
    if(!k){
      k=orig;
      const duenio=cuitPorKey[k];
      if(duenio&&duenio!==cu){
        k=orig+' ('+fmtCuit(cu)+')';
        const id=orig+'|'+cu;
        if(!vistos.has(id)){vistos.add(id);
          avisos.push({nombre:orig,cuits:[fmtCuit(duenio),fmtCuit(cu)],origen});}
      }
      keyPorCuit[cu]=k;if(!cuitPorKey[k])cuitPorKey[k]=cu;
    }
    r._c=k;
    if(orig!==k){alias[orig]=alias[orig]===undefined||alias[orig]===k?k:null;}  // null = ambiguo, no se usa
  };
  recCta.forEach(r=>asignar(r,'Cta Cte'));
  otras.forEach(([arr,origen])=>arr.forEach(r=>asignar(r,origen)));
  // Registros sin CUIT: por nombre, usando alias sólo si no es ambiguo
  [recCta,...otras.map(o=>o[0])].forEach(arr=>arr.forEach(r=>{
    if(!r._cuit&&alias[r._c]&&!cuitPorKey[r._c])r._c=alias[r._c];
  }));
  return{cuitPorKey,avisos};
}

function dirDesdeLista(lista){const d={};lista.forEach(([n,c])=>{const k=canonical(n),cu=cuitDigits(c);if(k&&cu&&!d[k])d[k]=cu;});return d;}
function parseBaseClientes(wb){
  const rows=sheetToRows(wb);if(!rows.length)return{};
  const h=rows[0].map(x=>(x||'').toString());
  const cN=findCol(h,['Nombre del Productor','Productor','Cliente','Raz.n Social','Nombre']);
  const cC=findCol(h,['^CUIT$','CUIT']);
  if(cN<0||cC<0)return{};
  return dirDesdeLista(rows.slice(1).filter(r=>r&&r[cN]).map(r=>[r[cN],r[cC]]));
}

function hoyISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function diaAnteriorISO(iso){
  const d=parseISODate(iso)||new Date();
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);

function fmtFechaISO(iso){const d=parseISODate(iso);return d?d.toLocaleDateString('es-AR'):'—';}
const r2=v=>Math.round(num(v)*100)/100;
// Última línea de defensa: aunque la función devuelva algo, si el precio por tonelada
// convertido a dólares no es plausible, no se aplica. Un grano no vale USD 19.000/tn.
const PRECIO_USD_MIN=70,PRECIO_USD_MAX=900;   // rango realista de soja/maíz/trigo en USD por tonelada
function preciosPlausibles(p){
  return['sojaUSD','maizUSD','trigoUSD'].every(k=>p[k]>=PRECIO_USD_MIN&&p[k]<=PRECIO_USD_MAX);
}

async function traerCotizaciones(fechaTablero){
  const objetivo=diaAnteriorISO(fechaTablero);
  try{
    const r=await fetch(COTIZ_API+'?fecha='+objetivo,{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      if((j.dolar&&j.dolar.ok)||(j.granos&&j.granos.ok))return{...j,objetivo};
    }
  }catch(e){/* la función no está publicada o no respondió */}
  // Respaldo: al menos el dólar, desde una API pública con CORS
  try{
    const r=await fetch(COTIZ_FALLBACK_USD,{cache:'no-store'});
    if(r.ok){
      const j=await r.json();
      if(j&&j.venta)return{ok:false,objetivo,

        granos:{ok:false},
        errores:['No respondió /api/cotizaciones: los precios de pizarra hay que cargarlos a mano.']};
    }
  }catch(e){}
  return{ok:false,objetivo,dolar:{ok:false},granos:{ok:false},
    errores:['No se pudieron traer las cotizaciones automáticamente.']};
}

// ═══ ENGINE ═══
// Cada Excel se parsea UNA sola vez a registros normalizados y después se filtra por período.
// Todo registro lleva _c (cliente canónico), _d (fecha que define el período) y _m (monto USD).

function parseISODate(v){
  if(!v)return null;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v.toString());
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);   // local, no UTC
  const d=new Date(v);return isNaN(d)?null:d;
}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function inPeriodD(d,s,e){
  if(!d)return false;const t=d.getTime();
  return t>=(s?s.getTime():-Infinity)&&t<=(e?e.getTime():Infinity);
}

function parseCta(wb){
  const rows=sheetToRows(wb);if(!rows.length)return[];
  const h=rows[0].map(x=>(x||'').toString());
  const cC=findCol(h,['Nombre del Productor','Productor','Cliente','Nombre']);
  const cComp=findCol(h,['Comprobante']);
  const cFcomp=findCol(h,['Fecha Comprobante','FechaComprobante']);
  const cFvto=findCol(h,['Fecha Vencimiento','Vencimiento']);
  const cS=findCol(h,['SALDO_AFECTADOS_DOLARES','Saldo.*D','Saldo']);
  const cTC=findCol(h,['Tipo de Cambio','TipoCambio','TC']);
  const cCuit=findCol(h,['^CUIT$','CUIT']);
  const out=[];const excl={tc:0,comp:0};
  // Directorio nombre → CUIT armado con TODAS las filas, incluso las que la limpieza descarta:
  // un cliente cuya cta cte sólo tiene RG/RI/CD (o movimientos en $) igual conserva su CUIT
  // para mostrarlo, aunque su deuda venga de otro archivo (ej. Pte de Facturar).
  const directorio={};
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||!r[cC])continue;
    if(cCuit>=0){const cu=cuitDigits(r[cCuit]);const k=canonical(r[cC]);if(cu&&!directorio[k])directorio[k]=cu;}
    // Limpieza: TC de emisión vacío ⇒ movimiento en $ ⇒ no va
    if(cTC>=0&&!(num(r[cTC])>0)){excl.tc++;continue;}
    const tipoComp=((cComp>=0?r[cComp]:'')||'').toString().trim().split(/\s+/)[0].toUpperCase();
    if(CTA_COMP_EXCLUIDOS.has(tipoComp)){excl.comp++;continue;}
    const saldo=num(r[cS]);
    out.push({_c:canonical(r[cC]),_cuit:cCuit>=0?cuitDigits(r[cCuit]):'',_d:parseDate(r[cFvto]),_m:saldo,
      comprobante:(cComp>=0?r[cComp]:'')||'',
      fechaComp:cFcomp>=0?r[cFcomp]:null,
      vencimiento:r[cFvto],
      tc:cTC>=0?num(r[cTC]):null,
      saldo});
  }
  out.excluidas=excl;out.sinColTC=cTC<0;out.directorio=directorio;
  return out;
}

function parseNegocios(wb){
  const rows=sheetToRows(wb);if(!rows.length)return[];
  const h=rows[0].map(x=>(x||'').toString());
  const cC=findCol(h,['Nombre del Productor','Productor','Cliente']);
  const cCod=findCol(h,['Código de Comprobante','Codigo.*Comp']);
  const cNro=findCol(h,['Numero de Comprobante','Numero.*Comp','Numero']);
  const cFecha=findCol(h,['Fecha$','Fecha ']);
  const cDesc=findCol(h,['Descripción$','Descripcion$','Descripción ']);
  const cCant=findCol(h,['Cantidad$','Cantidad ']);
  const cCantPend=findCol(h,['CANTIDAD_PENDIENTE','Cantidad.*Pend']);
  const cI=findCol(h,['IMPORTE','Importe','Monto']);
  const cR=findCol(h,['DESCIPCION_RUBRO','DESCRIPCION_RUBRO','Rubro']);
  const cFvto=findCol(h,['FECHA_VENCIMIENTO_ORIGEN','Vencimiento.*Origen']);
  const cCuit=findCol(h,['^CUIT$','CUIT.*Cliente','CUIT.*Productor']);
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||!r[cC])continue;
    const rubro=(r[cR]||'').toString();
    // "4 - Fertilizante" → IVA 10,5% | "1 - Agroquimico", "99 - Otros" y demás → IVA 21%
    const iva=/fert/i.test(rubro)?0.105:0.21;
    const imp=num(r[cI])*(1+iva);
    const cod=(cCod>=0?r[cCod]:'')||'';
    const nro=(cNro>=0?r[cNro]:'')||'';
    out.push({_c:canonical(r[cC]),_cuit:cCuit>=0?cuitDigits(r[cCuit]):'',_d:parseDate(r[cFvto]),_m:imp,
      comprobante:cod&&nro?cod+' '+nro:(cod||nro||'—'),
      fecha:cFecha>=0?r[cFecha]:null,
      descripcion:(cDesc>=0?r[cDesc]:'')||'',
      cantidad:cCant>=0?num(r[cCant]):null,
      cantidadPend:cCantPend>=0?num(r[cCantPend]):null,
      vencimiento:r[cFvto],
      importe:imp,iva:iva*100});
  }
  return out;
}

function parseCheques(wb,tc){
  const rows=sheetToRows(wb);if(!rows.length)return[];
  const h=rows[0].map(x=>(x||'').toString());
  const cC=findCol(h,['NOMBRE','Nombre','Cliente']);
  const cF=findCol(h,['Fecha Pago','FechaPago']);
  const cM=findCol(h,['Medio Pago','MedioPago','Medio','Tipo']);
  const cI=findCol(h,['IMPORTE_CHEQUE','Importe.*Cheque','Importe','Monto']);
  const cNum=findCol(h,['Numero Cheque','NroCheque','Numero','Nro']);
  const cEmision=findCol(h,['Fecha Emision','FechaEmision','Emision']);
  // Cheques: se unen por NOMBRE (vienen de la misma bajada de Algoritmo que la Cta Cte,
  // así que el nombre coincide). No se lee ningún CUIT: el del librador puede ser un tercero.
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||!r[cC])continue;
    if((r[cM]||'').toString().trim().toUpperCase()!=='T')continue;   // solo Medio Pago = "T"
    const imp=num(r[cI])/tc;
    // El período del cheque lo define SIEMPRE su fecha de pago (acreditación)
    out.push({_c:canonical(r[cC]),_cuit:'',_d:parseDate(r[cF]),_m:imp,
      numero:(cNum>=0?r[cNum]:'')||'',
      fechaEmision:cEmision>=0?r[cEmision]:null,
      fechaPago:r[cF],importeARS:num(r[cI]),importeUSD:imp});
  }
  return out;
}

// ═══ CHEQUES DESDE LA CTA CTE APLICADA ═══
// Reemplaza al Excel de "Valores en cartera": ese reporte mostraba cheques ya aplicados (Tesorería
// hace la OP más tarde) y se descontaban dos veces. Ahora se toman de la Cta Cte aplicada:
//   · comprobante RI, en $ (TC de emisión vacío)
//   · concepto "RI Interbanking" o "cheque"
//   · sólo lo que sigue PENDIENTE DE APLICAR, desde $1.000 (SALDO_MOVIMIENTOS_AFECTADOS). Un RI ya aplicado
//     queda con saldo ~0 y no resta nada, así que no hay doble descuento.
// El $ pendiente se pasa a USD con el TC del tablero, igual que antes. El período lo define la
// Fecha de Vencimiento del RI (fecha de acreditación del valor).
const CHQ_CONCEPTOS=/interbanking|cheque/i;
const CHQ_MIN_ARS=1000;   // sólo saldos pendientes de $1.000 para arriba: los $0,01 y similares son residuos de aplicación
function parseChequesCta(wb,tc){
  const rows=sheetToRows(wb);if(!rows.length)return[];
  const h=rows[0].map(x=>(x||'').toString());
  const cC=findCol(h,['Nombre del Productor','Productor','Cliente','Nombre']);
  const cComp=findCol(h,['Comprobante']);
  const cConc=findCol(h,['Concepto']);
  const cTC=findCol(h,['Tipo de Cambio','TipoCambio','TC']);
  const cPend=findCol(h,['SALDO_MOVIMIENTOS_AFECTADOS','Saldo.*Movim']);
  const cFcomp=findCol(h,['Fecha Comprobante','FechaComprobante']);
  const cFvto=findCol(h,['Fecha Vencimiento','Vencimiento']);
  const cCuit=findCol(h,['^CUIT$','CUIT']);
  const out=[];
  const faltan=[[cComp,'Comprobante'],[cConc,'Concepto'],[cPend,'SALDO_MOVIMIENTOS_AFECTADOS']].filter(x=>x[0]<0).map(x=>x[1]);
  out.diag={faltan,riTotal:0,riConcepto:0};
  if(faltan.length)return out;
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||!r[cC])continue;
    const tipo=(r[cComp]||'').toString().trim().split(/\s+/)[0].toUpperCase();
    if(tipo!=='RI')continue;
    out.diag.riTotal++;
    if(cTC>=0&&num(r[cTC])>0)continue;                       // sólo RI en $
    if(!CHQ_CONCEPTOS.test((r[cConc]||'').toString()))continue;
    out.diag.riConcepto++;
    const pendARS=-num(r[cPend]);                             // viene negativo (crédito del cliente)
    if(Math.abs(pendARS)<CHQ_MIN_ARS)continue;                // ya aplicado o residuo (ej. $0,01)
    const usd=pendARS/tc;
    out.push({_c:canonical(r[cC]),_cuit:cCuit>=0?cuitDigits(r[cCuit]):'',_d:parseDate(r[cFvto]),_m:usd,
      numero:(r[cComp]||'').toString().trim(),concepto:(r[cConc]||'').toString().trim(),
      fechaEmision:cFcomp>=0?r[cFcomp]:null,fechaPago:r[cFvto],importeARS:pendARS,importeUSD:usd});
  }
  return out;
}

function parseCanjes(wb,tc,precios){
  const rows=sheetToRows(wb);if(!rows.length)return[];
  const h=rows[0].map(x=>(x||'').toString());
  const cC=findCol(h,['Vendedor','Cliente','Nombre']);
  const cF=findCol(h,['FechaEntregaDesde','Fecha.*Entrega','Fecha']);
  const cP=findCol(h,['Precio']);const cPr=findCol(h,['Producto','Grano','Cereal']);
  const cE=findCol(h,['Tns Entregadas','TnsEntregadas','Entregadas']);
  const cL=findCol(h,['Tns Liquidadas','TnsLiquidadas','Liquidadas']);
  const cPe=findCol(h,['Tns Pendiente','TnsPendiente','Pendiente']);
  const cCtto=findCol(h,['Numero Contrato Hijo','Contrato Hijo','Numero.*Contrato','NroCtto','NumCtto','Nro.*Contrato']);
  const cCuit=findCol(h,['CUIT_Vendedor','CUIT.*Vendedor']);   // el CUIT_Comprador es FyO, no sirve
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||!r[cC])continue;
    const prod=(r[cPr]||'').toString().trim();
    let pUSD=num(r[cP]);
    if(!pUSD){
      if(/soja/i.test(prod))pUSD=precios.sojaUSD;
      else if(/ma[íi]z/i.test(prod))pUSD=precios.maizUSD;
      else if(/trigo/i.test(prod))pUSD=precios.trigoUSD;
      else pUSD=precios.sojaUSD;
    } else if(pUSD>1000){pUSD=pUSD/tc;}   // > 1.000 ⇒ viene en ARS, se convierte a USD
    pUSD=num(pUSD);
    const tn=Math.max(0,(num(r[cE])-num(r[cL]))+num(r[cPe]));
    const total=pUSD*tn*1.105;
    out.push({_c:canonical(r[cC]),_cuit:cCuit>=0?cuitDigits(r[cCuit]):'',_d:parseDate(r[cF]),_m:total,
      contrato:(cCtto>=0?r[cCtto]:'')||'',producto:prod,fechaEntrega:r[cF],precioUSD:pUSD,tn,total,
      // crudos: Deuda Vencida revaloriza con SU propio TC
      precioRaw:num(r[cP]),tnPend:num(r[cPe])});
  }
  return out;
}

// Filtra registros por período y ordena el detalle del MÁS VENCIDO / ANTIGUO al más reciente
function agg(recs,s,e){
  const totals={},detail={};
  for(const r of recs){
    if(!inPeriodD(r._d,s,e))continue;
    totals[r._c]=(totals[r._c]||0)+r._m;
    if(!detail[r._c])detail[r._c]=[];
    detail[r._c].push(r);
  }
  for(const k in detail)detail[k].sort((a,b)=>(a._d?a._d.getTime():Infinity)-(b._d?b._d.getTime():Infinity));
  return{totals,detail};
}

function calcDiasVencidos(recCta,today){
  // { [cliente]: {dias, saldoVencido, factVencidas:[...]} } — facturas de la más vencida a la menos
  const out={};
  for(const r of recCta){
    if(r.saldo<=0.01)continue;
    if(!r._d||r._d>today)continue;
    const dias=Math.floor((today-r._d)/86400000);
    if(!out[r._c])out[r._c]={dias:0,saldoVencido:0,factVencidas:[]};
    out[r._c].dias=Math.max(out[r._c].dias,dias);
    out[r._c].saldoVencido+=r.saldo;
    out[r._c].factVencidas.push({comprobante:r.comprobante,vencimiento:r.vencimiento,saldo:r.saldo,dias});
  }
  for(const k in out)out[k].factVencidas.sort((a,b)=>b.dias-a.dias);
  return out;
}

// conDeuda = clientes que registran deuda en ALGÚN período (cta cte o pte de facturar).
// Un cliente entra en la pestaña si tiene deuda en ese período O si —teniendo deuda en algún
// momento— tiene cheques/canjes cuya fecha cae en ese período.
function buildTable(ctaR,negR,chqR,canjeR,conDeuda){
  const all=new Set([...Object.keys(ctaR.totals),...Object.keys(negR.totals),...Object.keys(chqR.totals),...Object.keys(canjeR.totals)]);
  const rows=[];
  for(const c of all){
    const cta=ctaR.totals[c]||0,neg=negR.totals[c]||0,chq=chqR.totals[c]||0,canje=canjeR.totals[c]||0;
    const tieneDeuda=Math.abs(cta)+Math.abs(neg)>=0.01;
    if(!tieneDeuda&&!(conDeuda&&conDeuda.has(c)))continue;
    if(Math.abs(cta)+Math.abs(neg)+Math.abs(chq)+Math.abs(canje)<0.01)continue;
    rows.push({cliente:c,cta,neg,deuda:cta+neg,chq:-chq,canje:-canje,total:cta+neg-chq-canje,obs:'',
      detail:{facturas:ctaR.detail[c]||[],negocios:negR.detail[c]||[],cheques:chqR.detail[c]||[],canjes:canjeR.detail[c]||[]}});
  }
  return rows.sort((a,b)=>b.total-a.total);
}

function loadWB(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{try{res(XLSX.read(e.target.result,{type:'array',cellDates:false}))}catch(err){rej(err)}};
    reader.onerror=rej;reader.readAsArrayBuffer(file);
  });
}

function periodDates(ym){
  if(!ym)return{s:null,e:null,label:''};
  const[y,m]=ym.split('-').map(Number);
  return{s:new Date(y,m-1,1),e:new Date(y,m,0),label:new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}).replace(/^\w/,c=>c.toUpperCase())};

const MESES_CORTOS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function mesCorto(ym){const[y,m]=ym.split('-');return MESES_CORTOS[+m-1]+" '"+y.slice(2);}
// Importes sin centavos: con 13 columnas los decimales duplican el ancho sin aportar
function fmtUSD0(v){if(Math.abs(v)<0.5)return '—';return (v<0?'-$':'$')+Math.abs(Math.round(v)).toLocaleString('es-AR');}
const CONS_METRICAS=[{k:'deuda',l:'Deuda Total'},{k:'total',l:'Total General'},{k:'cta',l:'Cta Cte'},{k:'neg',l:'Pte de Facturar'}];
// Filas de la grilla según la métrica elegida. La usan la vista y la exportación.
function consFilas(cons,metrica,ocultarCeros){
  if(!cons)return[];
  let filas=cons.clientes.map(c=>{
    const vals=c.cells.map(cell=>cell?num(cell[metrica]):0);
    return{cliente:c.cliente,cuit:c.cuit||'',vals,tot:vals.reduce((a,b)=>a+b,0),cells:c.cells};
  });
  if(ocultarCeros)filas=filas.filter(f=>f.vals.some(v=>Math.abs(v)>=0.5));
  return filas.sort((a,b)=>b.tot-a.tot);
}

// Junta todas las celdas de una fila del consolidado en un único detalle, para que
// el modal muestre TODOS los períodos y su total coincida con el de la fila.
function unirCeldas(cliente,cells){
  const vivas=cells.filter(Boolean);
  const suma=k=>vivas.reduce((a,c)=>a+num(c[k]),0);
  const juntar=k=>{
    const out=[];
    vivas.forEach(c=>{(c.detail&&c.detail[k]||[]).forEach(x=>out.push(x));});
    return out.sort((a,b)=>(a._d?a._d.getTime():Infinity)-(b._d?b._d.getTime():Infinity));
  };
  const det={facturas:juntar('facturas'),negocios:juntar('negocios'),
             cheques:juntar('cheques'),canjes:juntar('canjes')};
  const n=det.facturas.length+det.negocios.length+det.cheques.length+det.canjes.length;
  return{cliente,cta:suma('cta'),neg:suma('neg'),deuda:suma('deuda'),
    chq:suma('chq'),canje:suma('canje'),total:suma('total'),detail:det,
    subtitulo:'Todos los períodos del consolidado · '+n+(n===1?' movimiento':' movimientos')};
}

const MAX_MESES_ADELANTE=24;   // tope de seguridad ante fechas basura muy futuras

function processFiles(files,params){
  const{tc,precios,fechaTablero}=params;
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const ref=parseISODate(fechaTablero)||hoy;
  const sinNegocios=!files.negocios;   // el Excel de Negocios es OPCIONAL
  // Ya no se usa el Excel de Valores en cartera: los cheques salen de la propia Cta Cte.
  return Promise.all([loadWB(files.ctaCte),
                      sinNegocios?Promise.resolve(null):loadWB(files.negocios),loadWB(files.canjes),
                      files.clientes?loadWB(files.clientes).catch(()=>null):Promise.resolve(null)])
    .then(([wCta,wNeg,wCanje,wCli])=>{
      const recCta=parseCta(wCta),recNeg=wNeg?parseNegocios(wNeg):[],
            recChq=parseChequesCta(wCta,tc),recCanje=parseCanjes(wCanje,tc,precios);
      const{cuitPorKey,avisos}=resolverClientes(recCta,[[recCanje,'Contratos'],[recChq,'Cheques'],[recNeg,'Pte Facturar']]);
      const dirCta=recCta.directorio||{};
      // Prioridad del CUIT: archivos del tablero → base cargada en el recuadro → base fija del código
      const dirBase={...dirDesdeLista(CUIT_BASE),...(wCli?parseBaseClientes(wCli):{})};
      const cuitDe=c=>fmtCuit(cuitPorKey[c]||dirCta[c]||dirBase[c]||'');

      const conDeuda=new Set();
      recCta.forEach(r=>{if(Math.abs(r._m)>=0.01)conDeuda.add(r._c)});
      recNeg.forEach(r=>{if(Math.abs(r._m)>=0.01)conDeuda.add(r._c)});

      // Meses con movimientos, detectados sobre las 4 fuentes
      const meses=new Set();
      [recCta,recNeg,recChq,recCanje].forEach(a=>a.forEach(r=>{if(r._d&&Math.abs(r._m)>=0.01)meses.add(monthKey(r._d))}));
      const curKey=monthKey(ref);
      const nextKey=monthKey(new Date(ref.getFullYear(),ref.getMonth()+1,1));
      const limite=monthKey(new Date(ref.getFullYear(),ref.getMonth()+MAX_MESES_ADELANTE,1));
      const posteriores=[...meses].filter(k=>k>curKey&&k<=limite).sort();
      const keys=[...new Set([curKey,nextKey,...posteriores])].sort();

      const periods=[{key:'vencido',label:'Vencido a la fecha',s:null,e:ref}];
      keys.forEach(k=>{const p=periodDates(k);periods.push({key:k,label:p.label,s:p.s,e:p.e});});
      // Para cualquier vista "acumulada" (s:null → todo lo vencido hasta una fecha, sin piso),
      // un contrato de canje solo cubre esa deuda si su entrega cae dentro del MES DE REFERENCIA,
      // incluso si la fecha de entrega ya pasó (ej.: tablero al 5/10 → se toman contratos con
      // entrega hasta el 31/10). Un contrato que entrega después NO cancela deuda ya vencida:
      // aparece en la pestaña de su propio mes.
      //
      // ¡OJO! Este límite NO puede pasar del último día del mes de referencia. Si se extiende
      // (antes llegaba hasta fin del mes SIGUIENTE), un contrato que entrega el 1/11 cae a la vez
      // en la vista acumulada y en la pestaña de noviembre; en el consolidado —donde las columnas
      // SE SUMAN para dar el Total— eso lo descuenta dos veces. Caso real: contrato 290249 de
      // ELORZA AGRO, restado en "Oct '26" y de nuevo en "Nov '26".
      const limiteCanjeVencido=new Date(ref.getFullYear(),ref.getMonth()+1,0);
      const armar=p=>{
        const eCanje=p.eCanje!==undefined?p.eCanje:(p.s===null?limiteCanjeVencido:p.e);
        return buildTable(agg(recCta,p.s,p.e),agg(recNeg,p.s,p.e),agg(recChq,p.s,p.e),agg(recCanje,p.s,eCanje),conDeuda);
      };
      periods.forEach(p=>{p.rows=armar(p);p.rows.forEach(r=>{r.cuit=cuitDe(r.cliente);});});

      // ── Vista consolidada ────────────────────────────────────────────────
      // La PRIMERA columna es el mes corriente y absorbe todo lo vencido de antes:
      // es todo vencimiento <= último día del mes corriente. Así no se superpone con
      // nada y el total por cliente es la suma limpia de las columnas.
      const finMesCorriente=new Date(ref.getFullYear(),ref.getMonth()+1,0);
      // eCanje explícito = la misma fecha de cierre de la columna. En el consolidado las columnas
      // se suman, así que CADA registro —incluidos los contratos de canje— tiene que caer en una
      // sola. Fijarlo acá deja el consolidado a salvo aunque algún día se vuelva a ampliar
      // limiteCanjeVencido para las pestañas.
      const consCols=[{key:curKey,label:periodDates(curKey).label,corto:mesCorto(curKey),
                       s:null,e:finMesCorriente,eCanje:finMesCorriente,acum:true}];
      keys.filter(k=>k>curKey).forEach(k=>{const p=periodDates(k);
        consCols.push({key:k,label:p.label,corto:mesCorto(k),s:p.s,e:p.e,acum:false});});
      const mapa=new Map();
      consCols.forEach((c,i)=>{
        armar(c).forEach(r=>{
          if(!mapa.has(r.cliente))mapa.set(r.cliente,{cliente:r.cliente,cuit:cuitDe(r.cliente),cells:new Array(consCols.length).fill(null)});
          mapa.get(r.cliente).cells[i]=r;
        });
      });
      const consolidado={cols:consCols.map(c=>({key:c.key,label:c.label,corto:c.corto,acum:c.acum})),
                         clientes:[...mapa.values()],avisos,
                         limpieza:{...(recCta.excluidas||{tc:0,comp:0}),sinColTC:!!recCta.sinColTC}};

      return{periods,consolidado,diasVencidos:calcDiasVencidos(recCta,hoy),fechaRef:ref,
             recs:{cta:recCta,chq:recChq,canje:recCanje},sinNegocios,
             chqDiag:{...(recChq.diag||{faltan:[],riTotal:0,riConcepto:0}),n:recChq.length}};
    });
}

function sumCol(rows,key){return rows.reduce((s,r)=>s+(r[key]||0),0);}
function getSemaforo(dias){

  if(dias>30)return{color:'rojo',label:'🔴 Crítico'};

// ═══ DEUDA VENCIDA ═══
// Reporte para niveles superiores. Solo cuenta corriente vencida a una fecha de corte propia.
// El respaldo (cheques + contratos de canje) NO se resta: se informa como texto en Comentarios.
const DV_STORAGE_KEY='tablero_deuda_vencida_v1';
function loadDV(){try{const d=localStorage.getItem(DV_STORAGE_KEY);return d?JSON.parse(d):{}}catch(e){return{}}}
function saveDV(d){try{localStorage.setItem(DV_STORAGE_KEY,JSON.stringify(d))}catch(e){}}

// Baldes de antigüedad, sin solaparse: 0-30 / 31-60 / 61-90 / 91+
const DV_BUCKETS=['0 - 30 días','30 - 60 días','60 - 90 días','+90 días'];
const DV_MIN_USD=1000;   // por debajo de este importe el cliente no se muestra ni suma al total
function dvBucket(dias){
  if(dias<=30)return 0;
  if(dias<=60)return 1;
  if(dias<=90)return 2;
  return 3;
}

// Día anterior a la fecha de corte — es el TC del BNA que hay que buscar a mano
function dvDiaAnterior(corte){
  if(!corte)return '';
  const d=new Date(corte.getFullYear(),corte.getMonth(),corte.getDate()-1);
  return d.toLocaleDateString('es-AR');
}

// Hasta el millón, en "mil usd" redondeado. De un millón en adelante, el número completo.
function fmtMil(v){
  return 'USD '+Math.round(v).toLocaleString('es-AR');
}

// Leyenda del contrato, cruzando Precio con Tns Pendiente Entrega
function dvEstadoCtto(precioRaw,tnPend){
  const conPrecio=num(precioRaw)>0,pendEntrega=num(tnPend)>0;
  if(!conPrecio&&pendEntrega)return 'pte de entrega y fijación';
  if(!conPrecio&&!pendEntrega)return 'pte de fijación';
  if(conPrecio&&pendEntrega)return 'pte de entrega';
  return '';
}

// Deuda vencida por cliente: solo cta cte con vencimiento <= corte, inclusive.
// Las notas de crédito vencidas netean dentro de su propio balde.
function calcDeudaVencida(recCta,corte){
  const out={};
  for(const r of recCta){
    if(!r._d||r._d>corte)continue;
    if(Math.abs(r.saldo)<0.005)continue;
    const dias=Math.floor((corte-r._d)/86400000);
    const bi=dvBucket(dias);
    if(!out[r._c])out[r._c]={total:0,buckets:[0,0,0,0],comprobantes:[]};
    out[r._c].total+=r.saldo;
    out[r._c].buckets[bi]+=r.saldo;
    out[r._c].comprobantes.push({comprobante:r.comprobante,vencimiento:r.vencimiento,dias,bucket:bi,saldo:r.saldo});
  }
  for(const k in out)out[k].comprobantes.sort((a,b)=>b.dias-a.dias);   // de la más vencida a la menos
  return out;
}

// Respaldo con el TC PROPIO de la sección. Los cheques NO se filtran por fecha de pago.
// Los contratos de canje SÍ: uno con entrega más allá de 1 mes después del mes de corte
// no cubre esta deuda ya vencida (va a aparecer como cobertura recién en su propio mes).
//
// Acá la ventana es a propósito más ancha que la del tablero (que corta a fin del mes de
// referencia): en Deuda Vencida los contratos NO se restan de ningún importe, sólo se informan
// en Comentarios. Mostrar "Ctto 300111 pte de entrega" de algo que entrega el mes que viene es
// información útil para gestión y no distorsiona ningún total. En el tablero y el consolidado,
// en cambio, el canje SÍ se descuenta, y ahí la ventana ancha duplicaba el descuento.
function calcRespaldo(recChq,recCanje,tcDV,precios,corte){
  const out={};
  const ini=c=>{if(!out[c])out[c]={chqTotal:0,cheques:[],contratos:[],cttoTotal:0,fuera:[]}};
  for(const r of recChq){                       // RI de la Cta Cte pendientes de aplicar
    const usd=num(r.importeARS)/(tcDV||1);
    if(Math.abs(usd)<0.005)continue;
    ini(r._c);out[r._c].chqTotal+=usd;
    out[r._c].cheques.push({numero:r.numero,fechaPago:r.fechaPago,importeARS:r.importeARS,usd});
  }
  const limiteCanje=corte?new Date(corte.getFullYear(),corte.getMonth()+2,0):null;
  for(const r of recCanje){
    const base={contrato:r.contrato,producto:r.producto,tn:r.tn,fechaEntrega:r.fechaEntrega};
    if(limiteCanje&&r._d&&r._d.getTime()>limiteCanje.getTime()){   // entrega demasiado lejana: no cubre esta deuda vencida
      ini(r._c);out[r._c].fuera.push({...base,motivo:'entrega posterior al '+limiteCanje.toLocaleDateString('es-AR')});
      continue;
    }
    let p=num(r.precioRaw);
    if(!p){
      const prod=r.producto||'';
      if(/soja/i.test(prod))p=precios.sojaUSD;
      else if(/ma[íi]z/i.test(prod))p=precios.maizUSD;
      else if(/trigo/i.test(prod))p=precios.trigoUSD;
      else p=precios.sojaUSD;
    } else if(p>1000){p=p/(tcDV||1);}
    p=num(p);
    const usd=p*r.tn*1.105;                     // misma fórmula ya documentada, en toneladas
    if(Math.abs(usd)<0.005){                    // los contratos que valorizan en 0 no se listan
      ini(r._c);out[r._c].fuera.push({...base,
        motivo:num(r.tn)?'precio en cero':'sin toneladas pendientes'});
      continue;
    }
    ini(r._c);out[r._c].cttoTotal+=usd;
    out[r._c].contratos.push({contrato:r.contrato,producto:r.producto,tn:r.tn,fechaEntrega:r.fechaEntrega,
      estado:dvEstadoCtto(r.precioRaw,r.tnPend),precioUSD:p,usd});
  }
  return out;
}

function dvComentarioAuto(resp){
  if(!resp)return 'En gestión de cobranza';
  const partes=[];
  if(Math.abs(resp.chqTotal)>=0.005)partes.push('Cheques en cartera - '+fmtMil(resp.chqTotal));
  resp.contratos.forEach(c=>{
    const nro=(c.contrato||'').toString().trim();
    partes.push('Ctto '+(nro||'s/n')+(c.estado?' '+c.estado:'')+' - '+fmtMil(c.usd));
  });
  return partes.length?partes.join(' / '):'En gestión de cobranza';
}

// Arma las filas del reporte. Se recalcula en vivo al mover la fecha de corte o el TC.
function dvRows(recs,corte,tcDV,precios,dvState){
  if(!recs||!corte)return[];
  const deuda=calcDeudaVencida(recs.cta,corte);
  const resp=calcRespaldo(recs.chq,recs.canje,tcDV,precios,corte);
  const rows=[];
  for(const c of Object.keys(deuda)){
    const d=deuda[c],r=resp[c]||null;
    if(d.total<=DV_MIN_USD)continue;         // deuda vencida menor o igual a USD 1.000 → fuera del reporte
    const st=dvState[c]||{};
    const auto=dvComentarioAuto(r);
    rows.push({
      cliente:c,total:d.total,buckets:d.buckets,comprobantes:d.comprobantes,
      cheques:r?r.cheques:[],contratos:r?r.contratos:[],cttosFuera:r?r.fuera:[],
      chqTotal:r?r.chqTotal:0,cttoTotal:r?r.cttoTotal:0,
      respaldo:(r?r.chqTotal:0)+(r?r.cttoTotal:0),
      comentarioAuto:auto,
      comentario:(st.comentario!==undefined&&st.comentario!==null)?st.comentario:auto,
      editado:st.comentario!==undefined&&st.comentario!==null,
      quitado:st.quitado===true          // sacado del reporte a mano
    });
  }
  return rows.sort((a,b)=>b.total-a.total);
}

function exportToExcel(periods,params,obs,dv,cons){
  const wb=XLSX.utils.book_new();
  const hdr=['CLIENTE','CTA CTE USD','PTE FACTURAR USD','DEUDA TOTAL USD','CHEQUES USD','CANJES USD','TOTAL GENERAL USD','OBSERVACIONES'];
  const usados=new Set();
  function safeName(label){
    let n=(label||'Período').replace(/[\\\/\?\*\[\]:]/g,'-').substring(0,31);
    let i=2,base=n;while(usados.has(n)){n=(base.substring(0,28)+'('+i+')');i++;}
    usados.add(n);return n;
  }
  function mkSheet(rows,label){
    const data=[hdr];
    rows.forEach(r=>data.push([r.cliente,r.cta||null,r.neg||null,r.deuda||null,r.chq||null,r.canje||null,r.total||null,obs[r.cliente]||'']));
    const tot=k=>rows.reduce((s,r)=>s+(r[k]||0),0);
    data.push(['TOTAL',tot('cta'),tot('neg'),tot('deuda'),tot('chq'),tot('canje'),tot('total'),'']);
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws['!cols']=[{wch:45},{wch:14},{wch:16},{wch:14},{wch:14},{wch:14},{wch:14},{wch:28}];
    XLSX.utils.book_append_sheet(wb,ws,safeName(label));
  }
  periods.forEach(p=>{if(p.rows&&p.rows.length)mkSheet(p.rows,p.label);});

  // Hoja del reporte de Deuda Vencida
  if(dv&&dv.rows&&dv.rows.length){
    const dh=['RAZ\u00d3N SOCIAL','PART. VENC. EN USD','0 - 30 D\u00cdAS','30 - 60 D\u00cdAS','60 - 90 D\u00cdAS','+90 D\u00cdAS','COMENTARIOS'];
    const data=[dh];
    dv.rows.forEach(r=>data.push([r.cliente,r.total||null,r.buckets[0]||null,r.buckets[1]||null,
      r.buckets[2]||null,r.buckets[3]||null,r.comentario]));
    const tt=dv.rows.reduce((a,r)=>a+(r.total||0),0);
    const tb=i=>dv.rows.reduce((a,r)=>a+(r.buckets[i]||0),0);
    data.push(['TOTAL ('+dv.rows.length+' clientes)',tt,tb(0),tb(1),tb(2),tb(3),'']);
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws['!cols']=[{wch:45},{wch:16},{wch:14},{wch:14},{wch:14},{wch:14},{wch:60}];
    XLSX.utils.book_append_sheet(wb,ws,safeName('Deuda Vencida'));
  }

  // Hoja del consolidado por mes
  if(cons&&cons.filas&&cons.filas.length){
    const hdr=['CLIENTE','CUIT',...cons.cols.map(c=>c.acum?c.label.toUpperCase()+' (INCLUYE VENCIDO)':c.label.toUpperCase()),'TOTAL'];
    const data=[hdr];
    cons.filas.forEach(f=>data.push([f.cliente,f.cuit||'',...f.vals.map(v=>v||null),f.tot||null]));
    const tc=i=>cons.filas.reduce((a,f)=>a+(f.vals[i]||0),0);
    data.push(['TOTAL ('+cons.filas.length+' clientes)','',...cons.cols.map((c,i)=>tc(i)),
      cons.filas.reduce((a,f)=>a+f.tot,0)]);
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws['!cols']=[{wch:45},{wch:15},...cons.cols.map(()=>({wch:16})),{wch:18}];
    XLSX.utils.book_append_sheet(wb,ws,safeName('Consolidado'));
  }

  const pd=[['Par\u00e1metro','Valor'],['Fecha del tablero',params.fechaTablero],['TC',params.tc],
    ['Soja USD/tn',params.precios.sojaUSD],['Ma\u00edz USD/tn',params.precios.maizUSD],['Trigo USD/tn',params.precios.trigoUSD]];
  if(dv){pd.push(['Deuda Vencida \u2014 fecha de corte',dv.corte],['Deuda Vencida \u2014 TC Divisa Vend. BNA',dv.tc]);}
  if(cons){pd.push(['Consolidado \u2014 m\u00e9trica',cons.metrica]);}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pd),'Par\u00e1metros');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const url=URL.createObjectURL(new Blob([out],{type:'application/octet-stream'}));
  Object.assign(document.createElement('a'),{href:url,download:`Tablero_Deuda_${(params.fechaTablero||'').replace(/\//g,'-')}.xlsx`}).click();
  URL.revokeObjectURL(url);
}

// ---------------------------- utilidades ----------------------------
const FUENTE = "'Poppins',Arial,Helvetica,sans-serif";
const C = { carbon: '1E2A2E', gris: '55666B', grisClaro: '8A979C', linea: 'DCE5E8', pagina: 'E9EDF0' };
const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// Saltos de línea del texto → <br> (para datos que vienen de Excel, formularios, etc.)
const conSaltos = (t) => esc(t).replace(/\r?\n/g, '<br>');

function mezclar(hex, con, k) {
  const a = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const b = [0, 2, 4].map((i) => parseInt(con.slice(i, i + 2), 16));
  return a.map((v, i) => Math.round(v * (1 - k) + b[i] * k).toString(16).padStart(2, '0')).join('').toUpperCase();
}
function contraste(a, b) {
  const L = (h) => [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)
    .map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4))
    .reduce((s, x, i) => s + x * [0.2126, 0.7152, 0.0722][i], 0);
  const [x, y] = [L(a), L(b)].sort((p, q) => q - p);
  return (x + 0.05) / (y + 0.05);
}
// Color de marca legible para texto chico y botones con texto blanco (≥ 4,5:1 sobre blanco).
function colorTexto(hex) {
  let k = 0, c = hex;
  while (contraste(c, 'FFFFFF') < 4.5 && k < 0.8) { k += 0.03; c = mezclar(hex, '000000', k); }
  return c;
}
function marcaMail(clave) {
  const k = String(clave || 'fyo').toLowerCase().replace(/^fyo[\s_-]*/, '') || 'fyo';
  const m = MARCAS_MAIL[k] || MARCAS_MAIL.fyo;
  return { clave: MARCAS_MAIL[k] ? k : 'fyo', ...m, texto: m.texto || colorTexto(m.principal), suave: mezclar(m.principal, 'FFFFFF', 0.93),
    etiquetaClara: mezclar(m.principal, 'FFFFFF', 0.55) };
}
// Logo a superficie equivalente al de FYO (32 px de alto): las submarcas, más largas, van más bajas.
function tamLogo(m, altoFyo = 32) {
  const h = Math.round(altoFyo * Math.sqrt(2.1199 / m.ratio));
  return { w: Math.round(h * m.ratio), h };
}

// ---------------------------- componentes del cuerpo ----------------------------
// Párrafo. `html: true` si el texto ya trae etiquetas (negritas, enlaces).
function parrafo(texto, { html = false, tam = 15 } = {}) {
  return `<p style="margin:0 0 16px 0; font-family:${FUENTE}; letter-spacing:-0.025em; font-size:${tam}px; line-height:1.6; color:#${C.gris};">${html ? texto : conSaltos(texto)}</p>`;
}
// Saludo con nombre destacado: saludo('¡Hola!', 'Te acercamos el cronograma…')
function saludo(titulo, texto) {
  return `<p style="margin:0 0 8px 0; font-family:${FUENTE}; letter-spacing:-0.025em; font-size:16px; line-height:1.5; font-weight:700; color:#${C.carbon};">${esc(titulo)}</p>${texto ? parrafo(texto) : ''}`;
}
// Etiqueta de sección (texto chico en mayúsculas espaciadas, como "EVENTOS DEL MES").
function etiqueta(texto) {
  return `<p style="margin:0; padding:20px 0 14px 2px; font-family:${FUENTE}; letter-spacing:-0.025em; font-size:11px; line-height:1.4; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:#${C.grisClaro};">${esc(texto)}</p>`;
}
// Botón a prueba de Outlook (VML redondeado en Outlook de escritorio, CSS en el resto).
function boton({ texto, url }, m) {
  const ancho = Math.max(150, Math.round(texto.length * 8.2 + 40));
  return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:16px;"><tr><td>
<!--[if mso]><v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="${esc(url)}" style="height:42px; v-text-anchor:middle; width:${ancho}px;" arcsize="24%" stroke="f" fillcolor="#${m.texto}"><w:anchorlock/><center style="color:#FFFFFF; font-family:Arial,sans-serif; font-size:14px; font-weight:bold;">${esc(texto)}</center></v:roundrect><![endif]-->
<!--[if !mso]><!--><a href="${esc(url)}" style="display:inline-block; padding:12px 22px; background-color:#${m.texto}; color:#FFFFFF; border-radius:10px; font-family:${FUENTE}; letter-spacing:-0.025em; font-size:14px; font-weight:600; line-height:18px; text-decoration:none;">${esc(texto)}</a><!--<![endif]-->
</td></tr></table>`;
}

// Arma todo lo que necesita el nodo HTTP Request para enviar el mail con las imágenes adentro.
// armarEnvio({ remitente, para, cc, asunto, marca, preheader, etiqueta, titulo, cuerpo, adjuntos })
//   remitente: casilla que envía (la de la credencial o una compartida con permiso).
//   para / cc: un mail, varios separados por ';' o un array.
//   adjuntos: archivos para adjuntar (certificados, informes): [{ nombre, tipo, base64 }]
//     En n8n, desde un archivo descargado en un nodo anterior:
//       const buf = await this.helpers.getBinaryDataBuffer(i, 'data');
//       adjuntos: [{ nombre: 'Certificado.pdf', tipo: 'application/pdf', base64: buf.toString('base64') }]
function armarEnvio({ remitente, para, cc, asunto, adjuntos = [], ...mail }) {
  const m = marcaMail(mail.marca);
  const lista = (v) => (Array.isArray(v) ? v : String(v || '').split(/[;,]/)).map((x) => x.trim()).filter(Boolean)
    .map((address) => ({ emailAddress: { address } }));
  const img = IMAGENES_MAIL[m.clave] || {};
  const imagenes = MODO_IMAGENES === 'adjuntas' ? [
    ['header', 'image/jpeg', 'jpg'], ['logo', 'image/png', 'png'],
    ...PIE_MAIL.redes.map(([, , clave]) => [`red-${clave}`, 'image/png', 'png']),
  ].filter(([t]) => img[t]).map(([t, tipo, ext]) => ({
    '@odata.type': '#microsoft.graph.fileAttachment', name: `${m.clave}-${t}.${ext}`, contentType: tipo,
    contentBytes: img[t], contentId: `fyo-${m.clave}-${t}`, isInline: true,
  })) : [];
  const archivos = (adjuntos || []).filter((a) => a && a.base64).map((a) => ({
    '@odata.type': '#microsoft.graph.fileAttachment', name: a.nombre, contentType: a.tipo || 'application/octet-stream',
    contentBytes: a.base64, isInline: false,
  }));
  const envio = { message: {
    subject: asunto || mail.titulo || '',
    body: { contentType: 'HTML', content: armarMail(mail) },
    toRecipients: lista(para), ccRecipients: lista(cc), attachments: [...imagenes, ...archivos],
  }, saveToSentItems: true };
  return { remitente, asunto: envio.message.subject, envio };
}

// REPORTE SEMANAL DE DEUDA VENCIDA
// Arma las dos salidas que se envían por mail todas las semanas:
//   · el mail HTML, con el módulo oficial de la skill fyo-identidad-visual
//   · el Excel adjunto, con el estilo de plantilla_planilla.py
// Se alimenta de las filas que ya calcula dvRows(), así que respeta los chips
// de clientes quitados y los comentarios editados a mano en Deuda Vencida.
// ═══════════════════════════════════════════════════════════════════════════

const REP_MIN_DESCUBIERTO=1000;   // USD: piso de descubierto para listar un cliente
const REP_LIMITE_MAS30=0.20;      // regla del 20%

// "281 mil usd" → 281000 · "1.043.566 usd" → 1043566. Sin "mil" ni "usd" no es un importe
// (así "Envía pagos 7/11" no se confunde con un monto).
function montoDeTexto(txt){
  if(!txt)return 0;
  let total=0,m;const re=/(\d[\d.,]*)\s*(mil)?\s*(usd|u\$s|dólares)?/gi;
  while((m=re.exec(txt.toString()))){
    if(!m[2]&&!m[3])continue;
    const n=parseFloat(m[1].replace(/\./g,'').replace(',','.'));
    if(!isFinite(n))continue;
    total+=m[2]?n*1000:n;
  }
  return total;
}

const REP_SUFIJOS=/\b(S\.?A\.?C\.?I\.?F\.?(\s*Y\s*A)?|SACIFYA|S\.?A\.?S\.?|S\.?R\.?L\.?|S\.?A\.?U\.?|S\.?A\.?|SRL|SAS|SAU|SA|SCA|SH|LTDA|LIMITADA|SOCIEDAD\s+ANONIMA|SOCIEDAD\s+SIMPLE(\s+DE)?|AGROPECUARIA|COMERCIAL|E\s+HIJOS|Y\s+CIA)\b/gi;
function nombreCorto(n,max=24){
  let s=(n||'').toString().replace(REP_SUFIJOS,' ').replace(/\s+/g,' ').trim();
  if(!s)s=(n||'').toString().trim();
  s=s.toLowerCase().replace(/(^|[\s'’-])([a-záéíóúñ])/g,(_,a,b)=>a+b.toUpperCase());
  return s.length>max?s.slice(0,max-1).trimEnd()+'…':s;
}
function repFecha(d){const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();}

function armarReporte(filas,corte){
  const vivas=filas.filter(r=>!r.quitado);   // los chips ✕ de Deuda Vencida quedan afuera
  const clientes=vivas.map(r=>{
    const vencido=r.total,b=r.buckets||[0,0,0,0];
    const mas30=b[1]+b[2]+b[3];
    // Cubierto: lo que el tablero ya cruza. Si no hay nada cruzado, se toma el importe
    // del comentario: es el único lugar donde hoy viven las plataformas (Nera / Procampo).
    const cruzado=(r.chqTotal||0)+(r.cttoTotal||0);
    const cubierto=cruzado>0?cruzado:montoDeTexto(r.comentario);
    const vencidos=(r.contratos||[]).filter(c=>{
      const d=c.fechaEntrega?parseDate(c.fechaEntrega):null;
      return d&&d.getTime()<corte.getTime();
    });
    return{cliente:r.cliente,vencido,buckets:b,mas30,cubierto,
      origenCubierto:cruzado>0?'cruzado':(cubierto>0?'comentario':'sin respaldo'),
      descubierto:Math.max(0,vencido-cubierto),
      incumplimiento:vencidos.length>0,contratos:r.contratos||[],comentario:r.comentario||''};
  });

  // Se lista al cliente SOLO por descubierto: si el vencido está cubierto va al resumen
  // "Otros clientes con vencido cubierto", aunque tenga un contrato con entrega vencida.
  const aSeguir=clientes.filter(c=>c.descubierto>=REP_MIN_DESCUBIERTO)
    .sort((a,b)=>b.descubierto-a.descubierto);
  const cubiertos=clientes.filter(c=>aSeguir.indexOf(c)<0)
    .sort((a,b)=>b.vencido-a.vencido);

  const sum=(arr,f)=>arr.reduce((a,c)=>a+f(c),0);
  const totalVencido=sum(clientes,c=>c.vencido);
  const totalMas30=sum(clientes,c=>c.mas30);

  const logistica=[];
  clientes.forEach(c=>(c.contratos||[]).forEach(k=>{
    const d=k.fechaEntrega?parseDate(k.fechaEntrega):null;
    logistica.push({cliente:c.cliente,contrato:(k.contrato||'s/n').toString().trim(),
      usd:k.usd,entregaVencida:!!(d&&d.getTime()<corte.getTime())});
  }));
  logistica.sort((a,b)=>(b.entregaVencida-a.entregaVencida)||(b.usd-a.usd));

  const pctMas30=totalVencido>0?totalMas30/totalVencido:0;
  return{
    fecha:corte,fechaTexto:repFecha(corte),
    totalVencido,totalDescubierto:sum(clientes,c=>c.descubierto),totalMas30,pctMas30,
    dentroDelLimite:pctMas30<=REP_LIMITE_MAS30,
    buckets:[0,1,2,3].map(i=>sum(clientes,c=>c.buckets[i])),
    aSeguir,logistica,nClientes:clientes.length,cubiertos,
    // "Otros" arrastra su cubierto y el resto de descubierto que quedó bajo el umbral,
    // para que las columnas del Excel cierren contra los indicadores.
    otros:{n:cubiertos.length,usd:sum(cubiertos,c=>c.vencido),
      cubierto:sum(cubiertos,c=>c.cubierto),descubierto:sum(cubiertos,c=>c.descubierto),
      buckets:[0,1,2,3].map(i=>sum(cubiertos,c=>c.buckets[i]))},
  };
}

// ── Gráficos ───────────────────────────────────────────────────────────────
// Port de scripts/graficos.js de la skill: el SVG se arma exactamente igual
// (misma geometría, mismos colores, Poppins con interletrado -25, barras con
// punta redondeada). Lo único que cambia es el rasterizador: la skill usa
// sharp en Node y acá se usa canvas, porque el tablero corre en el navegador.
const G_PPI=96,gpt=v=>(v*96)/72,G_TRACK=-0.025,G_RADIO=0.18*G_PPI;
const G_C={principal:'34BBA1',texto:'2A9984',carbon:'1E2A2E',gris:'5B6B70',linea:'D5DFE2',niebla:'F1FAF8'};
const G_SERIES=['34BBA1','E5484D','E09B00','7C5CD6','2B3A40'];
const gEsc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const gN=v=>Number(v).toLocaleString('es-AR');
function gTx(x,y,t,o){o=o||{};const tam=o.tam||10;
  return '<text x="'+x+'" y="'+y+'" font-family="Poppins, Arial, sans-serif" font-size="'+gpt(tam)+
    '" font-weight="'+(o.peso||400)+'" fill="#'+(o.color||G_C.carbon)+'" text-anchor="'+(o.ancla||'start')+
    '" dominant-baseline="'+(o.base||'alphabetic')+'" letter-spacing="'+(+(gpt(tam)*G_TRACK).toFixed(2))+'">'+gEsc(t)+'</text>';}
function gMaxEje(v){const p=Math.pow(10,Math.floor(Math.log10(v)));
  return [1,1.2,1.5,2,2.5,3,4,5,6,8,10].map(k=>k*p).find(m=>m>=v*1.08)||10*p;}
function svgBarras(o){
  const horizontal=!!o.horizontal,ancho=o.ancho||6.3,alto=o.alto||3.2;
  const W=ancho*G_PPI,H=alto*G_PPI,pad=18,cat=o.categorias,ser=o.series;
  const col=G_SERIES.slice(0,ser.length),ns=ser.length,nc=cat.length;
  const max=gMaxEje(Math.max.apply(null,ser.reduce((a,s)=>a.concat(s.valores),[])));
  const leyH=ns>1?30:0,ticks=4,r=7;
  let out='<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="'+G_RADIO+'" ry="'+G_RADIO+'" fill="#'+G_C.niebla+'"/>';
  const ln=(a,b,c,d)=>'<line x1="'+a+'" y1="'+b+'" x2="'+c+'" y2="'+d+'" stroke="#'+G_C.linea+'" stroke-width="0.75"/>';
  // El ancho del eje y el margen derecho se calculan según la etiqueta más larga:
  // con importes exactos ("2.373.100") no alcanzan los 42 px fijos de la plantilla.
  const anchoTxt=(t,tam)=>String(t).length*gpt(tam)*0.56;
  const maxEtq=Math.max(anchoTxt(gN(max),8),anchoTxt(gN(Math.round(max*0.75)),8));
  if(!horizontal){
    const px=pad+Math.max(42,maxEtq+10),pw=W-px-pad,py=pad+14,ph=H-py-pad-22-leyH;
    for(let t=0;t<=ticks;t++){const y=py+ph-(ph*t)/ticks;
      out+=ln(px,y,px+pw,y)+gTx(px-8,y,gN((max*t)/ticks),{tam:8,color:G_C.gris,ancla:'end',base:'middle'});}
    const slot=pw/nc,bw=Math.min(48,(slot*0.62-6*(ns-1))/ns),gw=bw*ns+6*(ns-1);
    cat.forEach((c,ci)=>{const gx=px+ci*slot+(slot-gw)/2;
      ser.forEach((s,si)=>{const v=s.valores[ci],bh=Math.max(1.5,(ph*v)/max),x=gx+si*(bw+6),y=py+ph-bh,rr=Math.min(r,bw/2,bh);
        out+='<path d="M'+x+','+(y+bh)+' L'+x+','+(y+rr)+' Q'+x+','+y+' '+(x+rr)+','+y+' L'+(x+bw-rr)+','+y+' Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+rr)+' L'+(x+bw)+','+(y+bh)+' Z" fill="#'+col[si]+'"/>';
        out+=gTx(x+bw/2,y-7,gN(v),{tam:8,ancla:'middle'});});
      out+=gTx(px+ci*slot+slot/2,py+ph+18,c,{tam:9,color:G_C.gris,ancla:'middle'});});
  }else{
    const derecha=Math.max(40,anchoTxt(gN(max),8)+14);   // la etiqueta va a la derecha de la barra
    const px=pad+92,pw=W-px-pad-derecha,py=pad+6,ph=H-py-pad-20-leyH;
    for(let t=0;t<=ticks;t++){const x=px+(pw*t)/ticks;
      out+=ln(x,py,x,py+ph)+gTx(x,py+ph+14,gN((max*t)/ticks),{tam:8,color:G_C.gris,ancla:'middle'});}
    const slot=ph/nc,bh=Math.min(30,(slot*0.62-5*(ns-1))/ns),gh=bh*ns+5*(ns-1);
    cat.forEach((c,ci)=>{const gy=py+ci*slot+(slot-gh)/2;
      ser.forEach((s,si)=>{const v=s.valores[ci],bw=Math.max(1.5,(pw*v)/max),y=gy+si*(bh+5),rr=Math.min(r,bh/2,bw);
        out+='<path d="M'+px+','+y+' L'+(px+bw-rr)+','+y+' Q'+(px+bw)+','+y+' '+(px+bw)+','+(y+rr)+' L'+(px+bw)+','+(y+bh-rr)+' Q'+(px+bw)+','+(y+bh)+' '+(px+bw-rr)+','+(y+bh)+' L'+px+','+(y+bh)+' Z" fill="#'+col[si]+'"/>';
        out+=gTx(px+bw+6,y+bh/2,gN(v),{tam:8,base:'middle'});});
      out+=gTx(px-10,py+ci*slot+slot/2,c,{tam:9,color:G_C.gris,ancla:'end',base:'middle'});});
  }
  if(ns>1){
    const items=ser.map((s,i)=>({s,i,w:16+s.nombre.length*gpt(9)*0.6}));
    const tot=items.reduce((a,it)=>a+it.w,0)+18*(items.length-1);
    let x=W/2-tot/2,y=H-pad-4;
    items.forEach(it=>{out+='<rect x="'+x+'" y="'+(y-9)+'" width="10" height="10" rx="3" fill="#'+col[it.i]+'"/>'
      +gTx(x+15,y,it.s.nombre,{tam:9,color:G_C.gris});x+=it.w+18;});
  }
  return{svg:'<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+
    '<rect width="'+W+'" height="'+H+'" fill="#FFFFFF"/>'+out+'</svg>',w:W,h:H};
}
// SVG → PNG con canvas (reemplaza a sharp). Devuelve solo el base64.
function svgAPng(g,escala){
  escala=escala||2;
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');
      cv.width=Math.ceil(g.w*escala);cv.height=Math.ceil(g.h*escala);
      const cx=cv.getContext('2d');
      cx.fillStyle='#FFFFFF';cx.fillRect(0,0,cv.width,cv.height);
      cx.drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/png').split(',')[1]);
    };
    img.onerror=()=>rej(new Error('No se pudo generar el gráfico.'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(g.svg);
  });
}
